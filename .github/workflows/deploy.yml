name: Deploy

# Database + edge functions, from this repo, one commit at a time.
#   staging:    after CI is green on branch staging (or by hand). No approval.
#   production: by hand only ("Run workflow", target production, commit sha). Waits for the owner's approval
#               (GitHub Environment "production"), and refuses a commit that is not on main or has no green
#               browser-test run on staging. The site itself ships through Vercel when main moves.
# Needs secret SUPABASE_ACCESS_TOKEN. Without it every job stops at the first step with a note.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: 'where to deploy'
        type: choice
        options: [staging, production]
        default: staging
      sha:
        description: 'full commit sha (production: required)'
        required: false

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  STAGING_REF: lcbiktjrjcygxbteqaiu
  PROD_REF: tgropjisnheppsxejfdn

jobs:
  staging:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
    steps:
      # until the owner adds the key: automatic runs skip with a note, a run by hand fails
      - name: Deploy key present
        id: key
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::secret SUPABASE_ACCESS_TOKEN missing"; exit 1; fi
          echo "::notice::staging deploy skipped: secret SUPABASE_ACCESS_TOKEN not set yet"
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ env.SHA }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.key.outputs.ok == 'true'
        with:
          version: 3.0.0
      - name: Database
        if: steps.key.outputs.ok == 'true'
        run: supabase db push --remote=$STAGING_REF --yes
      - name: Functions
        if: steps.key.outputs.ok == 'true'
        run: scripts/deploy-functions.sh $STAGING_REF
      - name: Functions answer with this commit
        if: steps.key.outputs.ok == 'true'
        run: scripts/check-build.sh https://$STAGING_REF.supabase.co "$SHA"
      - name: Audit row
        if: steps.key.outputs.ok == 'true'
        run: scripts/audit-deploy.sh $STAGING_REF "$SHA" "${{ github.actor }}"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy key present, sha given
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::secret SUPABASE_ACCESS_TOKEN missing"; exit 1; fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::give the full 40-char commit sha"; exit 1; fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Commit is on main
        run: |
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
      - name: Browser tests were green on staging for this commit
        # CI's own "Test reference pictures" commits are never tested themselves: walk back to the commit they follow
        run: |
          c="$SHA"
          while git log -1 --format=%s "$c" | grep -q '^Test reference pictures'; do c=$(git rev-parse "$c^"); done
          ok=$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --commit "$c" --json conclusion -q '[.[] | select(.conclusion=="success")] | length')
          if [ "${ok:-0}" -lt 1 ]; then echo "::error::no green 'Browser tests (staging)' run for $c"; exit 1; fi
          echo "staging browser tests green for $c"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 3.0.0
      - name: Database (what will change)
        run: supabase db push --remote=$PROD_REF --dry-run
      - name: Database
        run: supabase db push --remote=$PROD_REF --yes
      - name: Functions
        env:
          PRIMEOS_ALLOW_PROD: '1'
        run: scripts/deploy-functions.sh $PROD_REF
      - name: Functions answer with this commit
        run: scripts/check-build.sh https://$PROD_REF.supabase.co "$SHA"
      - name: Audit row
        run: scripts/audit-deploy.sh $PROD_REF "$SHA" "${{ github.actor }}"
