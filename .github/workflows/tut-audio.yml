name: tut-audio-fetch
on:
  push:
    branches: [staging]
    paths: ['tools/tut-audio/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq flac >/dev/null
          mkdir -p tools/tut-audio/out
          while read n u; do curl -sSfL -o "/tmp/$n.wav" "$u" && flac -s -f -8 -o "tools/tut-audio/out/$n.flac" "/tmp/$n.wav"; done < tools/tut-audio/urls.txt
          ls -la tools/tut-audio/out
          git config user.name "tut-bot"; git config user.email "tut-bot@users.noreply.github.com"
          git add tools/tut-audio/out
          git commit -qm "chore: tutorial narration files [skip ci]"
          git push
