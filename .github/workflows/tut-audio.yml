name: tut-audio-fetch
on:
  push:
    branches: [staging]
    paths: ['tools/tut-audio/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p tools/tut-audio/out /tmp/raw
          while read n u; do curl -sSfL -o "/tmp/raw/$n" "$u" || echo "FAIL $n"; done < tools/tut-audio/urls.txt
          for f in /tmp/raw/*; do b=$(basename "$f"); case "$b" in
            *.mp4) ffprobe -v error -show_entries stream=width,height,duration -of csv=p=0 "$f"; ffmpeg -nostdin -loglevel error -i "$f" -vf "scale='if(gt(iw,ih),960,-2)':'if(gt(iw,ih),-2,960)'" -c:v libx264 -crf 24 -preset veryfast -c:a aac -b:a 128k "tools/tut-audio/out/$b";;
            *) cp "$f" "tools/tut-audio/out/$b";; esac; done
          ls -la tools/tut-audio/out
          git config user.name "tut-bot"; git config user.email "tut-bot@users.noreply.github.com"
          git add -f tools/tut-audio/out
          git commit -qm "chore: tutorial media files [skip ci]"
          git push
