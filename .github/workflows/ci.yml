name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so a red main is never masked by a queue backlog.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` — NOT `npm install`. ci installs exactly what the lockfile
      # pins; install is free to resolve a newer (possibly compromised) version
      # without a single line of code changing.
      - run: npm ci
      - run: npm run typecheck
      # api/ is excluded from the main tsconfig — without this, edits to the
      # Vercel functions are never typechecked and break only in production.
      - run: npm run typecheck:api
      - run: npm run build

  guards:
    name: hardening guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/hardening-guards.mjs
      - run: node scripts/hardening-tests.mjs

  deno:
    name: edge functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The Edge Functions are Deno, so `tsc` never looks at them. Without this
      # job a broken import in supabase/functions ships and only fails on deploy.
      - run: deno check supabase/functions/**/*.ts

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later "removed" is still in the
          # objects, and still valid. Scanning only the tip finds nothing.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
