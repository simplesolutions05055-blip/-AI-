name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so a red main is never masked by a queue backlog.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` — NOT `npm install`. ci installs exactly what the lockfile
      # pins; install is free to resolve a newer (possibly compromised) version
      # without a single line of code changing.
      - run: npm ci
      - run: npm run typecheck
      # api/ is excluded from the main tsconfig — without this, edits to the
      # Vercel functions are never typechecked and break only in production.
      - run: npm run typecheck:api
      - run: npm run build

  guards:
    name: hardening guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/hardening-guards.mjs
      - run: node scripts/hardening-tests.mjs

  deno:
    name: edge functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The check/test commands live in package.json so the exclusion list has a
      # single home. That makes `npm run` a real dependency of this job rather
      # than something borrowed from whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deno needs --node-modules-dir=auto (set on both scripts) because the
      # functions import jsr:@supabase/supabase-js, which pulls npm dependencies
      # such as @supabase/realtime-js. Without it Deno refuses to resolve them
      # and never reaches typechecking. With it, Deno installs what it needs,
      # so this job deliberately does NOT run `npm ci`.
      # The Edge Functions are Deno, so `tsc` never looks at them — and Supabase
      # deploys them WITHOUT typechecking, so a bad function deploys "successfully"
      # and then returns BOOT_ERROR to every caller. That already happened once:
      # a codemod run twice produced `function json(req: Request, req: Request, …)`,
      # a duplicate parameter, and 23 of 35 functions failed to start in production.
      #
      # Two levels, deliberately:
      #  1. lint — the boot-fatal classes, enforced across EVERY function. These
      #     are what turn into a runtime SyntaxError.
      - run: deno lint --rules-tags= --rules-include=no-dupe-args,no-dupe-keys,no-dupe-class-members supabase/functions

      #  2. full typecheck — EVERY file under supabase/functions, no exclusions.
      #     It began as an include list of six, which meant every other function
      #     (and every function added later) was never typechecked at all.
      - run: npm run check:functions

      #  3. the unit tests. They existed and passed for months without ever
      #     running here, which meant nothing would have told us if one broke.
      - run: npm run test:functions

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later "removed" is still in the
          # objects, and still valid. Scanning only the tip finds nothing.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  rls:
    name: cross-tenant isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 32 RLS policies decide which tenant sees which row. This job builds two
      # throwaway brands, reads across the boundary as the wrong tenant, and
      # fails if anything comes back. Everything runs in a rolled-back
      # transaction, so it leaves no fixtures behind.
      #
      # Without DATABASE_URL the runner SKIPS instead of failing, so forks and
      # first-time contributors are not blocked by a missing secret. Set the
      # secret on this repo and the suite becomes enforcing.
      - run: node scripts/rls-tenant-isolation.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
