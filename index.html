<script>
/* ================= CALENDAR ================= */
SCREENS.calendar={
  nav:{t:'לוח תוכן',i:'cal'},
  render(){
    const v=S.calView;
    const dayNames=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const placed={4:[1],7:[2],8:[6],10:[5],11:[7],14:[8]};
    let bodyHtml='';
    if(v==='month'){
      let cells='';
      for(let i=0;i<35;i++){
        const dn=i-1; const off=dn<1||dn>30;
        const evs=(placed[dn]||[]).map(id=>items.find(x=>x.id===id)).filter(Boolean);
        cells+='<div class="cal-cell '+(off?'off':'')+' '+(dn===4?'today':'')+'">'+
          '<span class="dn">'+(off?'':dn)+'</span>'+
          evs.map(e=>'<button class="cal-ev '+ST[e.s].e+'" data-act="peek:'+e.id+'">'+esc(e.t.slice(0,26))+'</button>').join('')+
          '</div>';
      }
      bodyHtml='<div class="cal"><div class="cal-head">'+dayNames.map(d=>'<div>'+d+'</div>').join('')+'</div>'+
        '<div class="cal-grid">'+cells+'</div></div>';
    } else if(v==='week'){
      bodyHtml='<div class="cal"><div class="cal-head">'+dayNames.map((d,i)=>'<div>'+d+' '+(6+i)+'</div>').join('')+'</div>'+
        '<div class="cal-grid">'+dayNames.map((d,i)=>{const dn=6+i;
          const evs=(placed[dn]||[]).map(id=>items.find(x=>x.id===id)).filter(Boolean);
          return '<div class="cal-cell" style="min-height:220px">'+evs.map(e=>
            '<button class="cal-ev '+ST[e.s].e+'" style="padding:8px" data-act="peek:'+e.id+'"><span style="display:block">'+esc(e.t)+'</span>'+
            '<span style="font-weight:500;opacity:.85">'+esc((e.pub||'').split(' ')[1]||'')+'</span></button>').join('')+'</div>';}).join('')+
        '</div></div>';
    } else {
      const list=items.filter(i=>['scheduled','approved','pending','published'].includes(i.s));
      bodyHtml='<div class="tbl-wrap"><table class="responsive"><thead><tr><th>מועד</th><th>כותרת</th><th>מחלקה</th><th>ערוצים</th><th>סטטוס</th><th></th></tr></thead><tbody>'+
        list.map(i=>'<tr><td data-l="מועד"><b>'+esc(i.pub||'-')+'</b></td>'+
        '<td data-l="כותרת"><span class="row-title" data-act="open:'+i.id+'">'+esc(i.t)+'</span></td>'+
        '<td data-l="מחלקה">'+esc(i.d)+'</td><td data-l="ערוצים">'+i.ch.map(c=>CH[c].t).join(', ')+'</td>'+
        '<td data-l="סטטוס">'+badge(i.s)+'</td>'+
        '<td><button class="btn btn-sm" data-act="peek:'+i.id+'">תצוגה מהירה</button></td></tr>').join('')+
        '</tbody></table></div>';
    }
    return pageHead({
      title:'לוח התוכן',
      desc:'ספטמבר 2026 · כל התכנים המתוזמנים, המאושרים והממתינים, לפי מחלקה וערוץ.',
      actions:'<button class="btn btn-primary" data-nav="create">'+ic('create',16)+' תוכן חדש</button>'
    })+
    '<div class="filters">'+
      '<button class="icon-btn" data-act="toastInfo:מוצג החודש הנוכחי בלבד במוקאפ" aria-label="חודש קודם">'+ic('chevR',17)+'</button>'+
      '<b style="font-size:14.5px;min-width:110px;text-align:center">ספטמבר 2026</b>'+
      '<button class="icon-btn" data-act="toastInfo:מוצג החודש הנוכחי בלבד במוקאפ" aria-label="חודש הבא">'+ic('chevL',17)+'</button>'+
      '<button class="btn btn-sm" data-act="toastInfo:הלוח ממוקד בשבוע הנוכחי">היום</button>'+
      '<select id="calDept"><option value="">כל המחלקות</option>'+DEPTS.map(d=>'<option>'+d+'</option>').join('')+'</select>'+
      '<select id="calCh"><option value="">כל הערוצים</option>'+Object.values(CH).map(c=>'<option>'+c.t+'</option>').join('')+'</select>'+
      '<select id="calSt"><option value="">כל הסטטוסים</option>'+Object.values(ST).map(s=>'<option>'+s.t+'</option>').join('')+'</select>'+
      '<div class="seg" style="margin-inline-start:auto">'+[['month','חודש'],['week','שבוע'],['list','רשימה']]
        .map(x=>'<button class="'+(v===x[0]?'on':'')+'" data-act="calview:'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
      ['draft','pending','approved','scheduled','published'].map(k=>badge(k)).join('')+
      '<span class="chip" style="margin-inline-start:auto">'+ic('help',13)+' גרירה בין תאריכים היא הדגמה ויזואלית בלבד</span></div>'+
    bodyHtml;
  }
};

/* ================= APPROVALS ================= */
SCREENS.approvals={
  nav:{t:'אישורים',i:'checkc',count:()=>counts().pending},
  render(){
    const tab=S.tab.approvals||'mine';
    let list=[];
    if(tab==='mine')list=items.filter(i=>i.s==='pending');
    else if(tab==='sent')list=items.filter(i=>['fix','rejected','approved','scheduled'].includes(i.s));
    else list=items.filter(i=>['published','archived','rejected'].includes(i.s));
    const head=pageHead({
      title:'מרכז האישורים',
      desc:'בדיקה, אישור, בקשת תיקון או דחייה מנומקת - עם היסטוריה מלאה לכל פריט.'
    })+
    '<div class="tabs">'+[['mine','ממתינים לאישור שלי',counts().pending],['sent','נשלחו על ידי',items.filter(i=>['fix','rejected','approved','scheduled'].includes(i.s)).length],['history','היסטוריה',items.filter(i=>['published','archived','rejected'].includes(i.s)).length]]
      .map(t=>'<button class="'+(tab===t[0]?'on':'')+'" data-act="tab:approvals:'+t[0]+'">'+t[1]+'<span class="cnt">'+t[2]+'</span></button>').join('')+'</div>';
    if(!list.length)return head+emptyState({i:'checkc',t:tab==='mine'?'אין פריטים שממתינים לך':'אין פריטים להצגה',d:tab==='mine'?'כל מה שנשלח לאישור שלך טופל. פריט חדש יופיע כאן מיד עם שליחתו.':'כשיהיו פריטים בקטגוריה הזו הם יופיעו כאן.',btn:'יצירת תוכן',nav:'create'});
    if(tab!=='mine'){
      return head+'<div class="tbl-wrap"><table class="responsive"><thead><tr><th>כותרת</th><th>מחלקה</th><th>סטטוס</th><th>מועד מתוכנן</th><th>עודכן</th><th></th></tr></thead><tbody>'+
        list.map(i=>'<tr><td data-l="כותרת"><span class="row-title" data-act="open:'+i.id+'">'+esc(i.t)+'</span></td>'+
        '<td data-l="מחלקה">'+esc(i.d)+'</td><td data-l="סטטוס">'+badge(i.s)+'</td>'+
        '<td data-l="מועד">'+esc(i.pub||'-')+'</td><td data-l="עודכן" class="t-sub">'+esc(i.u)+'</td>'+
        '<td><button class="btn btn-sm" data-act="open:'+i.id+'">פתיחה</button></td></tr>').join('')+'</tbody></table></div>';
    }
    const it=list[0];
    return head+
    '<div class="grid" style="grid-template-columns:1fr;gap:12px;margin-bottom:18px">'+
      list.map((x,idx)=>'<div class="card" style="'+(idx===0?'border-color:var(--brand-300)':'')+'"><div class="rowi" style="padding:14px 18px">'+
        '<span class="ic-box warn">'+ic('clock',17)+'</span>'+
        '<span class="grow"><span class="nm">'+esc(x.t)+'</span><br><span class="mt">'+esc(x.o)+' · '+esc(x.d)+' · מועד מתוכנן '+esc(x.pub||'לא נקבע')+'</span></span>'+
        '<span class="chip hide-sm">'+ic('clock',13)+' ממתין '+esc(x.wait||'שעה')+'</span>'+
        '<button class="btn btn-sm '+(idx===0?'btn-primary':'')+'" data-act="review:'+x.id+'">בדיקה</button></div></div>').join('')+
    '</div>'+
    '<h2 style="font-size:16px;margin:0 0 12px">בדיקת „'+esc(it.t)+'”</h2>'+
    reviewPanel(it);
  }
};

  return '<div class="split-wide"><div class="card card-pad">'+
    '<div class="split"><div class="preview-pane" style="min-height:300px">'+postPreview(it)+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:14px">'+
      '<div class="kv">'+[['מבקש',it.o],['מחלקה',it.d],['ערוצים',it.ch.map(c=>CH[c].t).join(', ')],['מועד מתוכנן',it.pub||'לא נקבע']]
        .map(r=>'<div class="r"><span class="k">'+r[0]+'</span><span class="v">'+esc(r[1])+'</span></div>').join('')+'</div>'+
      '<div class="field"><label>טקסט הפרסום</label><textarea rows="6" disabled>'+esc(it.body)+'\n\n'+esc(it.cta||'')+'</textarea></div>'+
    '</div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line-2)">'+
      '<button class="btn btn-ok" data-act="approve:'+it.id+'">'+ic('check',16)+' אישור</button>'+
      '<button class="btn" data-act="askfix:'+it.id+'">'+ic('undo',16)+' בקשת תיקון</button>'+
      '<button class="btn btn-quiet-bad" data-act="reject:'+it.id+'">'+ic('x',16)+' דחייה</button>'+
      '<span class="chip" style="margin-inline-start:auto;align-self:center">'+ic('help',13)+' דחייה מחייבת סיבה</span>'+
    '</div></div>'+
    '<div class="card"><div class="card-head">'+ic('note',17)+'<h3>הערות</h3></div>'+
      '<div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">'+
        '<div><b style="font-size:13.5px">נועה אברהם</b> <span class="t-sub">לפני 40 דקות</span>'+
        '<div style="font-size:13.5px;margin-top:4px;line-height:1.6">הבריף הגיע ממחלקת התרבות. אם צריך שינוי בשעות, אפשר לעדכן לפני התזמון.</div></div>'+
        '<div class="field"><textarea rows="3" placeholder="הערה למבקש"></textarea></div>'+
        '<button class="btn btn-sm" data-act="addNote">הוספת הערה</button>'+
      '</div>'+
      '<div class="card-head" style="border-top:1px solid var(--line-2)">'+ic('hist',17)+'<h3>היסטוריית שינויים</h3></div>'+
      '<div class="tl">'+[['נוצר','נועה אברהם · אתמול 16:20','','edit'],['עודכן הטקסט','נועה אברהם · אתמול 17:05','','edit'],['נשלח לאישור','נועה אברהם · '+it.u,'warn','send']]
        .map(r=>'<div class="tl-i"><span class="tl-dot '+r[2]+'">'+ic(r[3],13,2)+'</span><span class="tl-tx"><b>'+r[0]+'</b><br><span class="tl-time">'+r[1]+'</span></span></div>').join('')+'</div>'+
    '</div></div>';
}

/* ================= PUBLICATIONS ================= */

  nav:{t:'פרסומים',i:'send'},
  render(){

        '<td>'+(i.s==='failed'?'<button class="btn btn-sm btn-primary" data-act="retry:'+i.id+'">'+ic('refresh',14)+' ניסיון חוזר</button>':

      '</tbody></table></div>'

  }

SCREENS.settings={

    const tab=S.tab.settings||'org';
    let panel='';

        '<div class="field"><label>אתר אינטרנט</label><input type="text" value="www.nave-hadar.muni.il"></div>'+

      panel='<div class="tbl-wrap" style="max-width:760px"><table class="responsive"><thead><tr><th>מחלקה</th><th>מאשר ראשי</th><th>פריטים פעילים</th><th></th></tr></thead><tbody>'+
        DEPTS.map(d=>'<tr><td data-l="מחלקה"><span style="display:flex;align-items:center;gap:8px"><span class="dept-color" style="background:'+DEPT_C[d]+'"></span><b>'+d+'</b></span></td>'+
        '<td data-l="מאשר">'+(d==='תרבות ואירועים'?'דניאל לוי':'יעל כהן')+'</td><td data-l="פריטים">'+items.filter(i=>i.d===d).length+'</td>'+
        '<td><button class="btn btn-sm" data-act="toastInfo:נפתחה עריכת המחלקה (הדגמה)">עריכה</button></td></tr>').join('')+'</tbody></table></div>';
    } else if(tab==='notif'){
      panel='<div class="card card-pad" style="max-width:640px;display:flex;flex-direction:column;gap:4px">'+

        '<span>'+r[0]+'</span><button class="sw '+(r[1]?'on':'')+'" data-act="toggleSw" role="switch" aria-checked="'+r[1]+'" aria-label="'+r[0]+'"></button></div>').join('')+'</div>';
    } else {
      panel='<div class="card card-pad" style="max-width:760px"><div class="form-grid">'+
        '<div class="field"><label>מסלול אישור ברירת מחדל</label><select><option>יוצר ← מנהל מחלקה ← דוברות</option><option>יוצר ← דוברות</option></select></div>'+
        '<div class="field"><label>שעת פרסום מועדפת</label><input type="time" value="18:00"></div>'+
        '<div class="field"><label>ערוצי ברירת מחדל</label><select><option>Facebook + Instagram</option><option>כל הערוצים המחוברים</option></select></div>'+
        '<div class="field"><label>טון כתיבה ברירת מחדל</label><select><option>רשמי</option><option>קהילתי</option><option>שירותי</option><option>חגיגי</option></select></div>'+
        '</div><div style="margin-top:18px"><button class="btn btn-primary" data-act="saveSettings">שמירת שינויים</button></div></div>';

  }
};

/* ================= NAV + ROUTER ================= */
const NAV_ORDER=['dashboard','create','library','calendar','approvals','publications','whatsapp','channels','brand','team','reports','settings'];
function buildNav(){
  const G={create:'יצירה',approvals:'בקרה',whatsapp:'ערוצים',brand:'ארגון'};
  $('#nav').innerHTML=NAV_ORDER.map(k=>{
    const n=SCREENS[k].nav, c=n.count?n.count():0;
    return (G[k]?'<div class="nav-group">'+G[k]+'</div>':'')+'<button class="nav-item '+(S.route===k?'active':'')+'" data-nav="'+k+'">'+ic(n.i,18)+' '+n.t+
      (c?'<span class="cnt">'+c+'</span>':'')+'</button>';
  }).join('');
  $$('.side-foot .nav-item').forEach(b=>b.classList.toggle('active',S.route==='support'));
}
const visited=new Set();
function go(r,opts){
  if(S.route==='wizard'&&S.dirty&&r!=='wizard'&&!(opts&&opts.force)){
    confirmModal({title:'לצאת בלי לשמור?',body:'יש שינויים שלא נשמרו באשף היצירה. אפשר לשמור טיוטה ולחזור אליה מאוחר יותר.',
      ok:'יציאה בלי לשמור',cancel:'המשך עריכה',tone:'warn',icon:'alert',
      onOk:()=>{S.dirty=false;S.wiz=null;go(r,{force:true});}});
    return;
  }
  S.route=r; S.sideOpen=false; $('#sidebar').classList.remove('open');
  buildNav();
  const heavy=['library','calendar','approvals','reports','publications'];
  if(heavy.includes(r)&&!visited.has(r)){
    visited.add(r); S.loading=true; render();
    setTimeout(()=>{S.loading=false;render();},430);
  } else { visited.add(r); render(); }
  window.scrollTo({top:0});
}
function render(){
  const sc=SCREENS[S.route]||SCREENS.dashboard;
  $('#view').innerHTML=S.loading?skeleton():sc.render();
  if(!S.loading&&sc.mount)sc.mount();
  buildNav();
}

function collectWiz(){
  const w=S.wiz;
  const g=(id)=>{const el=$('#'+id);return el?el.value:null;};
  if(w.step===0){w.brief.dept=g('wDept')||w.brief.dept;w.brief.title=g('wTitle')||w.brief.title;w.brief.free=g('wFree')||w.brief.free;
    if(!w.content.title&&w.brief.title)w.content.title=w.brief.title;}
  if(w.step===1){w.content.title=g('cTitle')!==null?g('cTitle'):w.content.title;w.content.body=g('cBody')!==null?g('cBody'):w.content.body;
    w.content.cta=g('cCta')!==null?g('cCta'):w.content.cta;w.content.tone=g('cTone')||w.content.tone;}
  if(w.step===3){w.dist.date=g('dDate')||w.dist.date;w.dist.time=g('dTime')||w.dist.time;}
  if(w.step===4){w.appr.who=g('aWho')||w.appr.who;w.appr.note=g('aNote')||w.appr.note;}
}

function ageMin(u){
  u=String(u||'');
  if(u.includes('עכשיו'))return 0;
  let m=u.match(/(\d+)\s*דקות/);if(m)return +m[1];
  if(u.includes('לפני שעה'))return 60;
  m=u.match(/(\d+)\s*שעות/);if(m)return +m[1]*60;
  if(u.includes('אתמול')||u.includes('לפני יום'))return 1440;
  if(u.includes('יומיים'))return 2880;
  m=u.match(/(\d+)\s*ימים/);if(m)return +m[1]*1440;
  if(u.includes('שבוע'))return 10080;
  if(u.includes('חודשיים'))return 86400;
  if(u.includes('חודש'))return 43200;
  return 999999;
}
function byRecent(list){return list.slice().sort((a,b)=>ageMin(a.u)-ageMin(b.u));}

    '<span class="cc-row">'+badge(i.s)+chDots(i.ch)+'</span></div>'+
    '<div class="cc-foot"><button class="btn btn-sm" data-act="open:'+i.id+'">פתיחה</button>'+

}

function revChart(W){
  W=W||640;const T=totals(ORGS);const data=MFACT.map(f=>[T.r*f[0],T.c*f[1]]);
  const H=240,pl=8,pr=58,pt=18,pb=34,max=Math.ceil(Math.max(...data.flat())/2000)*2000;
  const cw=(W-pl-pr)/6,bw=Math.min(22,cw/3.4),y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  for(let t=0;t<=4;t++){const v=max*t/4,yy=y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" class="gl"/><text x="'+(W-pr+8)+'" y="'+(yy+4)+'" class="ax" text-anchor="start">'+(v/1000).toFixed(0)+'K</text>';}
  data.forEach((d,i)=>{const cx=W-pr-cw*(i+.5);
    const x1=cx+1,x2=cx-bw-1;
    g+='<g class="bar-g"><rect class="hit" x="'+(cx-cw/2)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pt-pb)+'"/>'+
      '<path d="'+barPath(x1,y(d[0]),bw,H-pb)+'" fill="#2A4BF0"/><path d="'+barPath(x2,y(d[1]),bw,H-pb)+'" fill="#E0069F"/>'+
      '<text x="'+cx+'" y="'+(H-pb+20)+'" class="ax" text-anchor="middle">'+MONTHS[i]+'</text>'+
      '<g class="tip-g" transform="translate('+Math.max(96,Math.min(W-pr-96,cx))+','+(pt+4)+')"><rect x="-92" y="0" width="184" height="54" rx="10"/><text x="80" y="22" text-anchor="start" class="tt1">'+MONTHS[i]+'</text>'+
      '<text x="80" y="42" text-anchor="start" class="tt2">הכנסות '+nis(d[0])+' · הוצאות '+nis(d[1])+'</text></g></g>';
    if(i===5){g+='<text x="'+(x1+bw/2)+'" y="'+(y(d[0])-7)+'" class="dl" text-anchor="middle">'+(d[0]/1000).toFixed(1)+'K</text><text x="'+(x2+bw/2)+'" y="'+(y(d[1])-7)+'" class="dl" text-anchor="middle">'+(d[1]/1000).toFixed(1)+'K</text>';}
  });
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" class="base"/>';
  return '<div class="chart-legend"><span><i style="background:#2A4BF0"></i>הכנסות</span><span><i style="background:#E0069F"></i>הוצאות</span></div>'+
    '<svg class="rev-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="הכנסות מול הוצאות בששת החודשים האחרונים">'+g+'</svg>';

function suggestTags(title,dept){
  const base=['נווה_הדר','עיריית_נווה_הדר'];
  const words=String(title||'').replace(/[״"׳',.:!?]/g,'').split(/\s+/).filter(w=>w.length>2).slice(0,2).map(w=>w);
  const out=[...base,...(TAG_BANK[dept]||['עדכון_לתושבים']),...words.map(w=>w)];
  return [...new Set(out)].slice(0,5).map(t=>'#'+t);
}

  else{if(g('sTitle')!==null)w.t=g('sTitle');if(g('sBody')!==null)w.body=g('sBody');if(g('sDate'))w.date=g('sDate');if(g('sTime'))w.time=g('sTime');}

    pub:w.mode==='now'?'':w.date+' '+w.time,ch:[...w.ch],th:GV[w.g%GV.length],body:w.body,cta:'',tags:[...w.tags],wait:'דקה'};

  const cw=(W-pl-pr)/6,bw=hasRev?Math.min(22,cw/3.4):Math.min(34,cw/2.2),y=v=>pt+(H-pt-pb)*(1-v/max);

  data.forEach((d,i)=>{const cx=W-pr-cw*(i+.5);
    const xc=hasRev?cx-1:cx+bw/2,xr=cx+bw+1;
    g+='<g class="bar-g"><rect class="hit" x="'+(cx-cw/2)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pt-pb)+'"/>'+
      '<path d="'+barPath(xc,y(d[0]),bw,H-pb)+'" fill="#E0069F"/>'+(hasRev?'<path d="'+barPath(xr,y(d[1]),bw,H-pb)+'" fill="#2A4BF0"/>':'')+
      '<text x="'+cx+'" y="'+(H-pb+20)+'" class="ax" text-anchor="middle">'+MONTHS[i]+'</text>'+
      '<g class="tip-g" transform="translate('+Math.max(80,Math.min(W-pr-80,cx))+','+(pt-2)+')"><rect x="-76" y="0" width="152" height="'+(hasRev?54:38)+'" rx="10"/><text x="64" y="22" text-anchor="start" class="tt1">'+MONTHS[i]+' · הוצאות '+usd(d[0])+'</text>'+
      (hasRev?'<text x="64" y="42" text-anchor="start" class="tt2">הכנסות '+usd(d[1])+'</text>':'')+'</g></g>';
    if(i===5)g+='<text x="'+(xc-bw/2)+'" y="'+(y(d[0])-7)+'" class="dl" text-anchor="middle">'+usd(d[0])+'</text>';
  });
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" class="base"/>';
  return (hasRev?'<div class="chart-legend"><span><i style="background:#E0069F"></i>הוצאות</span><span><i style="background:#2A4BF0"></i>הכנסות</span></div>':'')+
    '<svg class="rev-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="הוצאות חודשיות">'+g+'</svg>';
}

/* ---------- history + back button on every screen (1) ---------- */
const HIST=[];
const snap=()=>({r:S.route,itemId:S.itemId,orgId:S.orgId,campId:S.campId,campMode:S.campMode,guideId:S.guideId,tab:JSON.parse(JSON.stringify(S.tab))});
const _go3=go;
go=function(r,opts){const prev=snap();_go3(r,opts);if(!(opts&&opts.back)&&S.route!==prev.r&&prev.r)HIST.push(prev);if(HIST.length>40)HIST.shift();};
ACT.goBack=()=>{
  const doBack=()=>{const h=HIST.pop();const home=S.mode==='admin'?'a_dash':'dashboard';
    if(!h){go(home,{back:true,force:true});return;}
    S.itemId=h.itemId;S.orgId=h.orgId;S.campId=h.campId;S.campMode=h.campMode;S.guideId=h.guideId;S.tab=h.tab;go(h.r,{back:true,force:true});};
  if(S.route==='wizard'&&S.dirty){confirmModal({title:'לחזור בלי לשמור?',body:'יש שינויים שלא נשמרו. אפשר לשמור טיוטה ולחזור אליה מאוחר יותר.',ok:'חזרה בלי לשמור',cancel:'המשך עריכה',onOk:()=>{S.dirty=false;S.wiz=null;doBack();}});return;}
  if(S.route==='a_new'&&S.nw&&S.nw.step>0){confirmModal({title:'לצאת מהקמת הלקוח?',body:'הנתונים שהוזנו לא יישמרו.',ok:'יציאה',cancel:'המשך הקמה',onOk:()=>{S.nw=null;doBack();}});return;}
  if(S.route==='brand'&&S.brandEdit){confirmModal({title:'לצאת ממצב עריכה?',body:'השינויים בנכסי המותג לא נשמרו.',ok:'יציאה בלי לשמור',cancel:'המשך עריכה',onOk:()=>{ACT.brandCancel(true);doBack();}});return;}
  doBack();
};
function backBar(){
  const home=S.mode==='admin'?'a_dash':'dashboard';
  if(S.route===home&&!HIST.length)return '';
  const prev=HIST.length?HIST[HIST.length-1].r:home;
  const name=(SCREENS[prev]&&SCREENS[prev].nav&&SCREENS[prev].nav.t)||({item:'הפריט',wizard:'העריכה',bulk:'תוכן תקופתי',bulkReview:'הסדרה',support:'מרכז התמיכה',sup_guides:'המדריכים',sup_guide:'המדריך',sup_videos:'סרטוני ההדרכה',a_org:'פרופיל הלקוח',a_new:'הקמת לקוח'})[prev]||'המסך הקודם';
  return '<div class="backbar"><button class="back-btn" data-act="goBack" aria-label="חזרה">'+ic('fwd',17,2)+'<span>חזרה ל'+esc(name)+'</span></button></div>';
}

function seeded(seed,n,base,amp,trend){let x=seed;const out=[];for(let i=0;i<n;i++){x=(x*9301+49297)%233280;const r=x/233280;out.push(Math.max(0,Math.round(base*(1+trend*i/n)+amp*(r-.5)*2+amp*.6*Math.sin(i/2.3))));}return out;}

function lineChart(vals,W,H,col){
  const pl=6,pr=46,pt=14,pb=26,max=Math.max(...vals)*1.12||1,n=vals.length;
  const x=i=>W-pr-(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  let g='';for(let t=0;t<=3;t++){const v=max*t/3,yy=y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" class="gl"/><text x="'+(W-pr+6)+'" y="'+(yy+4)+'" class="ax">'+(v>=1000?(v/1000).toFixed(1)+'K':Math.round(v))+'</text>';}
  [0,Math.round((n-1)/2),n-1].forEach(i=>{g+='<text x="'+x(i)+'" y="'+(H-6)+'" class="ax" text-anchor="middle">'+(i===0?'היום':'לפני '+i+' ימים')+'</text>';});
  return '<svg class="rev-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="מגמה יומית">'+g+
    '<path d="M'+pts.join(' L')+' L'+x(n-1)+','+(H-pb)+' L'+x(0)+','+(H-pb)+'Z" fill="'+col+'" opacity=".12"/>'+
    '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(0)+'" cy="'+y(vals[0])+'" r="4.5" fill="'+col+'" stroke="#fff" stroke-width="2"/></svg>';
}

function meetSlots(date){
  const [fh,fm]=MEET_CFG.from.split(':').map(Number),[th,tm]=MEET_CFG.to.split(':').map(Number),out=[];
  for(let m=fh*60+fm;m+MEET_CFG.len<=th*60+tm;m+=MEET_CFG.len)out.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
  return out.filter(t=>!MEETINGS.some(x=>x.date===date&&x.time===t&&x.st==='scheduled'));
}
function meetDays(){const out=[];let d='2026-09-06';while(out.length<10){if(MEET_CFG.days.includes(dayOf(d)))out.push(d);d=addDays(d,1);}return out;}

function aiAnswer(q){
  const has=(...w)=>w.some(x=>q.includes(x));const me=curUser().n;
  const scope=isDept()?items.filter(i=>i.d===S.dept):items;
  if(S.mode==='admin'){
    if(has('הוצא','עלות','כסף')){const T=T2(ORGS);return 'ההוצאה החודשית היא <b>'+usd(T.c)+'</b>: '+ORGS.filter(o=>o.plan==='appr'&&o.st!=='paused').length+' לקוחות במסלול המורחב ו־'+ORGS.filter(o=>o.plan==='solo'&&o.st!=='paused').length+' במסלול הבסיסי.';}
    if(has('בקש','הרחב')){const r=REQS.filter(x=>x.st==='new');return r.length?'יש <b>'+r.length+'</b> בקשות פתוחות:<br>'+r.map(x=>'• '+orgById(x.org).n+' · '+(x.type==='users'?'עוד '+x.add+' משתמשים':'עוד '+x.add+' מחלקות')+' · '+x.who).join('<br>'):'אין בקשות הרחבה פתוחות.';}
    if(has('פגיש','יומן')){const m=MEETINGS.filter(x=>x.st==='scheduled');return m.length?m.map(x=>'• '+DAYN[dayOf(x.date)]+' '+fmtDM(x.date)+' '+x.time+' · '+orgById(x.org).n+' · '+x.topic).join('<br>'):'אין פגישות קרובות.';}
    if(has('שימוש','לקוח','פעיל')){const t=ORGS.slice().sort((a,b)=>b.items-a.items)[0];return 'השימוש הגבוה ביותר: <b>'+t.n+'</b> עם '+t.items+' פריטים ו־'+t.gfx+' גרפיקות החודש ('+pct(t.gfx,QUOTA.gfx)+'% מהמכסה).';}
    return 'אני מחובר לכל הלקוחות, המשתמשים, הבקשות והפגישות במערכת הניהול. נסו לשאול על הוצאות, שימוש, בקשות או פגישות.';
  }
  if(has('אישור','ממתין')){const p=scope.filter(i=>i.s==='pending'&&(isDept()||i.o!==me));return p.length?(isDept()?'נשלחו לאישור ':'ממתינים לאישור שלך ')+'<b>'+p.length+'</b> פריטים:<br>'+p.map(i=>'• '+esc(i.t)+' · '+esc(i.d)+(i.src==='wa'?' · מ־WhatsApp':'')).join('<br>'):'אין פריטים שממתינים לאישור.';}
  if(has('תיקון')){const p=scope.filter(i=>i.s==='fix');return p.length?p.map(i=>'• '+esc(i.t)+': '+esc(i.fixnote||'')).join('<br>'):'אין פריטים בתיקון.';}
  if(has('מתוזמן','השבוע','לוח')){const p=scope.filter(i=>i.s==='scheduled'||i.s==='approved');return p.length?p.map(i=>'• '+esc(i.pub||'ללא מועד')+' · '+esc(i.t)).join('<br>'):'אין כרגע תכנים מתוזמנים.';}
  if(has('סטטוס','תכנים')){const c={};scope.forEach(i=>c[i.s]=(c[i.s]||0)+1);return Object.entries(c).map(([k,v])=>'• '+ST[k].t+': <b>'+v+'</b>').join('<br>');}
  if(has('רעיון','פוסט','חג')){const t=TOPICS[isDept()?S.dept:'דוברות']||TOPICS['דוברות'];return 'שלושה רעיונות לפי לוח האירועים ומסמכי הייחוס:<br>• '+t[0]+'<br>• '+t[1]+'<br>• ברכה לרגל '+HOLIDAYS[0][0]+' ('+fmtD(HOLIDAYS[0][1])+')<br>אפשר לפתוח כל רעיון כטיוטה ממרכז היצירה.';}
  if(has('משתמש','הזמנ')){return 'צוות והרשאות ← „הזמנת משתמש”. במנוי יש '+myOrg().uLim+' משתמשים ו־'+users.length+' בשימוש. אם המנוי מלא, תופיע הודעה עם כפתור „שליחת בקשה” למנהל המערכת.';}
  if(has('טלפון','מורש','מייל')){return 'הגדרות ← פרטי המחלקה ← גישה למערכת. מוסיפים או מסירים טלפון ומייל ולוחצים „שמירת שינויים”.';}
  if(has('ערוץ','עוקב','חשיפה')){return 'ב„נתוני ערוצים” רואים נתונים חיים לכל עמוד מחובר. לדוגמה, ב־Facebook יש כרגע 18,400 עוקבים.';}
  return 'אני מחובר לכל התכנים, הלוח, האישורים ונכסי המותג של הארגון. אפשר לשאול על סטטוס, על מה לפרסם, או איך עושים פעולה במערכת.';
}

function addMonths(iso,n){const[y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1+n,d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}

/* expenses: vendors + AI usage per client */
SCREENS.a_finance.render=function(){
  const f=S.fF;const idx=f.period==='quarter'?[3,4,5]:f.period==='half'?[0,1,2,3,4,5]:[5];
  const list=ORGS.filter(o=>(!f.org||o.id===f.org)&&(!f.plan||o.plan===f.plan));
  const rows=list.map(o=>({o,c:idx.reduce((s,i)=>s+aiCost(o.useM&&o.useM[MNUM[i]]),0),u:Object.fromEntries(USE_T.map(t=>[t[0],o[t[0]]||0]))})).sort((a,b)=>b.c-a.c||b.o.items-a.o.items);
  const AI=rows.reduce((s,x)=>s+x.c,0),V=vendorsIls()*idx.length,C=AI+V,mxC=Math.max(...rows.map(x=>x.c),1);
  const U=Object.fromEntries(USE_T.map(t=>[t[0],rows.reduce((s,x)=>s+x.u[t[0]],0)]));
  const perUser=AUSERS.filter(u=>list.some(o=>o.id===u.org)).length;const outs=U.gfx+U.docs+U.decks+U.vids;
  return pageHead({title:'הוצאות ושימוש',desc:'מה המערכת עולה: מנויי הספקים ושימוש ה־AI בפועל, בכלל ולפי לקוח.',actions:'<button class="btn" data-act="toastInfo:הקובץ ירד בפורמט CSV (הדגמה)">'+ic('down',16)+' ייצוא</button><button class="btn" data-act="asTabGo:money">'+ic('gear',16)+' ספקים ומחירים</button>'})+
  '<div class="filters">'+
    '<div class="seg">'+[['month','החודש'],['quarter','רבעון'],['half','חצי שנה']].map(p=>'<button class="'+(f.period===p[0]?'on':'')+'" data-act="fPer:'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'+
    '<select id="fPlan"><option value="">כל המסלולים</option>'+Object.entries(PLANS).map(([k2,p])=>'<option value="'+k2+'"'+(f.plan===k2?' selected':'')+'>'+p.t+'</option>').join('')+'</select>'+
    '<select id="fOrg"><option value="">כל הלקוחות</option>'+ORGS.map(o=>'<option value="'+o.id+'"'+(f.org===o.id?' selected':'')+'>'+o.n+'</option>').join('')+'</select></div>'+
  '<div class="grid g-4" style="margin-bottom:16px">'+
    stat({l:'הוצאות',n:usd(C),s:'ספקים '+usd(V)+' · AI '+usd(AI),i:'refresh',nav:'a_finance',f:'scheduled'})+
    stat({l:'תוצרים',n:outs.toLocaleString('en-US'),s:U.gfx+' גרפיקות · '+U.docs+' מסמכים',i:'spark',nav:'a_finance',f:'published'})+
    stat({l:'שאלות AI',n:U.ai.toLocaleString('en-US'),s:'בכל הממשקים',i:'bot',nav:'a_finance',f:'pending'})+
    stat({l:'עלות AI לתוצר',n:outs?'₪'+(AI/outs).toFixed(2):'-',s:perUser+' משתמשים · '+(perUser?usd(AI/perUser/idx.length):'-')+' למשתמש בחודש',i:'users',nav:'a_finance',f:'draft'})+
  '</div>'+
  '<div class="split-wide" style="margin-bottom:16px"><div class="card"><div class="card-head">'+ic('chart',18)+'<h3>הכנסות והוצאות לפי חודש</h3></div><div class="card-pad" style="padding-top:12px">'+moneyChart(760,MNUM,list)+'</div></div>'+vendorsCard()+'</div>'+
  '<div class="card" style="margin-bottom:16px"><div class="card-head">'+ic('spark',18)+'<h3>שימוש לפי סוג</h3></div><div class="card-pad quota" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">'+USE_T.map(t=>'<div><div class="q-row"><b>'+ic(t[2],14)+' '+t[1]+'</b><span>'+U[t[0]].toLocaleString('en-US')+'</span></div>'+uBar(U[t[0]],Math.max(...USE_T.map(x=>U[x[0]]),1),'pu')+'</div>').join('')+'</div></div>'+
  '<div class="tbl-wrap"><table class="responsive"><thead><tr><th>לקוח</th><th>מסלול</th><th>משתמשים</th>'+USE_T.map(t=>'<th>'+t[1]+'</th>').join('')+'<th>עלות AI</th><th>חלק מעלות ה־AI</th></tr></thead><tbody>'+
  (rows.length?rows.map(x=>'<tr data-act="aOrgFin:'+x.o.id+'"><td data-l="לקוח"><span class="org-cell">'+orgAv(x.o)+'<b>'+esc(x.o.n)+'</b></span></td><td data-l="מסלול">'+planBadge(x.o.plan)+'</td><td data-l="משתמשים">'+orgUsers(x.o).length+'</td>'+useCells(x.u)+
    '<td data-l="עלות AI"><b class="neg">'+usd(x.c)+'</b></td><td data-l="חלק"><div class="uwrap">'+uBar(x.c,mxC,'pk')+'<span>'+(AI?Math.round(x.c/AI*100):0)+'%</span></div></td></tr>').join(''):'<tr><td colspan="10" class="t-sub">עדיין אין שימוש לדווח עליו.</td></tr>')+
  '<tr class="tot-row"><td data-l="">סה״כ AI</td><td></td><td>'+perUser+'</td>'+useCells(U)+'<td data-l="עלות"><b>'+usd(AI)+'</b></td><td></td></tr>'+
  '<tr class="tot-row"><td data-l="">ספקים</td><td></td><td></td>'+USE_T.map(()=>'<td></td>').join('')+'<td data-l="עלות"><b>'+usd(V)+'</b></td><td></td></tr></tbody></table></div>';
};

/* client page: income + AI cost */
const _aorgR9=SCREENS.a_org.render;

  const o=orgById(S.orgId)||ORGS[0];const tab=S.tab.aorg||'over';
  if(!o||tab!=='fin')return _aorgR9.call(this);
  const rev=orgRevM(o),ai=aiShare(o);
  const hist=MNUM.map((m,i)=>[MONTHS[i],orgPays(o,m)?PLANS[o.plan].cost:0,aiCost(o.useM&&o.useM[m]),orgLive(o,m)]).reverse();
  const panel='<div class="grid g-2" style="margin-bottom:16px">'+
    '<div class="card"><div class="card-head">'+ic('chart',18)+'<h3>הכנסה חודשית</h3><b style="margin-inline-start:auto" class="pos">'+(rev?usd(rev):'ניסיון')+'</b></div><div class="fin-lines">'+
      '<div><span>'+PLANS[o.plan].t+' <span class="t-sub">('+PLANS[o.plan].d+')</span></span><b>'+usd(PLANS[o.plan].cost)+'</b></div>'+
      '<div><span>מע״מ '+Math.round(VAT*100)+'%</span><b>'+usd(PLANS[o.plan].cost*VAT)+'</b></div>'+
      (o.st==='trial'?'<div><span>תקופת ניסיון'+(o.agr&&o.agr.trialEnd?' עד '+heDate(o.agr.trialEnd):'')+'</span><b>-'+usd(PLANS[o.plan].cost)+'</b></div>':'')+
      (o.st==='paused'?'<div><span>חשבון מושהה</span><b>-'+usd(PLANS[o.plan].cost)+'</b></div>':'')+
      '<div class="tot"><span>לחודש, לפני מע״מ</span><b>'+usd(rev)+'</b></div><div class="tot"><span>לשנה, לפני מע״מ</span><b>'+usd(rev*12)+'</b></div></div></div>'+
    '<div class="card"><div class="card-head">'+ic('refresh',18)+'<h3>עלות AI החודש</h3><b style="margin-inline-start:auto" class="neg">'+usd(ai)+'</b></div><div class="fin-lines">'+USE_T.map(t=>'<div><span>'+t[1]+'</span><b>'+(o[t[0]]||0)+'</b></div>').join('')+
      '<div class="tot"><span>רווח גולמי לחודש</span><b class="'+(rev-ai>=0?'pos':'neg')+'">'+usd(rev-ai)+'</b></div></div></div></div>'+
    '<div class="card"><div class="card-head">'+ic('hist',18)+'<h3>היסטוריה</h3></div><div class="tbl-wrap flat"><table class="responsive"><thead><tr><th>חודש</th><th>הכנסה</th><th>עלות AI</th><th>רווח</th></tr></thead><tbody>'+
    hist.map(h=>'<tr><td data-l="חודש"><b>'+h[0]+'</b></td><td data-l="הכנסה">'+(h[3]?(h[1]?usd(h[1]):'ניסיון'):'-')+'</td><td data-l="AI">'+(h[3]?usd(h[2]):'-')+'</td><td data-l="רווח">'+(h[3]?'<b class="'+(h[1]-h[2]>=0?'pos':'neg')+'">'+usd(h[1]-h[2])+'</b>':'-')+'</td></tr>').join('')+'</tbody></table></div></div>';
  const h=_aorgR9.call(this);const at=h.indexOf('</div>',h.indexOf('<div class="tabs">'))+6;
  return h.slice(0,at)+panel;
};

      '<td data-l="תחילה">'+(o.agr&&o.agr.start?esc(o.agr.start):o.since)+'</td><td data-l="חיוב">'+(o.agr&&o.agr.trial&&o.agr.trialEnd?heDate(o.agr.trialEnd):(o.agr&&o.agr.start?esc(o.agr.start):o.since))+'</td>'+
      '<td data-l="לחודש"><b class="'+(r?'pos':'')+'">'+(r?usd(r):'ניסיון')+'</b></td><td data-l="לשנה">'+usd((r||PLANS[o.plan].cost)*12)+'</td><td data-l="AI"><b class="neg">'+usd(ai)+'</b></td><td data-l="רווח"><b class="'+(r-ai>=0?'pos':'neg')+'">'+usd(r-ai)+'</b></td></tr>';}).join(''):'<tr><td colspan="9" class="t-sub">עדיין אין לקוחות.</td></tr>')+
    '<tr class="tot-row"><td data-l="">סה״כ</td><td></td><td>'+paying.length+' משלמים</td><td></td><td></td><td data-l="לחודש"><b>'+usd(mrr)+'</b></td><td data-l="לשנה"><b>'+usd(mrr*12)+'</b></td><td data-l="AI"><b>'+usd(monthAi(MK_NOW))+'</b></td><td data-l="רווח"><b>'+usd(mrr-monthAi(MK_NOW))+'</b></td></tr></tbody></table></div>';
  }
};

/* settings: vendors, prices, packages */
const _asR9=SCREENS.a_settings.render;
SCREENS.a_settings.render=function(){
  const h=_asR9.call(this);
  const tabs='<div class="tabs">'+[['access','מנהלים והרשאות'],['me','הפרופיל שלי'],['money','ספקים ומחירים']].map(t=>'<button class="'+(S.asTab===t[0]?'on':'')+'" data-act="asTab:'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  const at=h.indexOf('<div class="tabs">');const head=h.slice(0,at);
  if(S.asTab!=='money')return head+tabs+h.slice(h.indexOf('</div>',at)+6);
  const num=(id,v,step)=>'<input type="text" inputmode="decimal" id="'+id+'" dir="ltr" style="text-align:right;max-width:140px" value="'+v+'">';
  const panel='<div class="grid g-2">'+
    '<div class="card"><div class="card-head">'+ic('refresh',18)+'<h3>מנויי ספקים</h3><span class="t-sub" style="margin-inline-start:auto;display:inline">לחודש, בדולר</span></div><div class="card-pad" style="display:flex;flex-direction:column;gap:12px">'+
      VENDORS.map(v=>'<div class="field" style="display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center"><label style="margin:0">'+esc(v.n)+' <span class="hint">'+esc(v.note||'')+' · '+usd(v.usd*FX.usd)+'</span></label>'+num('vd-'+v.k,v.usd)+'</div>').join('')+
      '<div class="field" style="display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center"><label style="margin:0">שער דולר <span class="hint">₪ לדולר</span></label>'+num('fx-usd',FX.usd)+'</div>'+
      '<div class="tot" style="display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line-2);padding-top:10px"><span>סה״כ ספקים לחודש</span><span>'+usd(vendorsIls())+'</span></div></div></div>'+
    '<div class="card"><div class="card-head">'+ic('bot',18)+'<h3>תעריפי שימוש</h3><span class="t-sub" style="margin-inline-start:auto;display:inline">בדולר, נצבר לפי יצירות</span></div><div class="card-pad" style="display:flex;flex-direction:column;gap:12px">'+
      [['cin','Claude · מיליון טוקנים קלט'],['cout','Claude · מיליון טוקנים פלט'],['img_low','ChatGPT · תמונה באיכות נמוכה'],['img_med','ChatGPT · תמונה באיכות בינונית'],['img_high','ChatGPT · תמונה באיכות גבוהה'],['tts','ElevenLabs · אלף תווי קריינות'],['music','ElevenLabs · דקת מוזיקה'],['stock','Pixabay · קטע או תמונה'],['render','Vercel · דקת רינדור סרטון']].map(r=>'<div class="field" style="display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center"><label style="margin:0">'+r[1]+'</label>'+num('rt-'+r[0],RATES[r[0]])+'</div>').join('')+'</div></div>'+
    '<div class="card"><div class="card-head">'+ic('deck',18)+'<h3>מסלולים</h3><span class="t-sub" style="margin-inline-start:auto;display:inline">₪ לחודש, לפני מע״מ, מנוי שנתי</span></div><div class="card-pad" style="display:flex;flex-direction:column;gap:12px">'+
      Object.entries(PLANS).map(([k,p])=>'<div class="field" style="display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center"><label style="margin:0">'+esc(p.t)+' <span class="hint">כולל מע״מ: '+usd(withVat(p.cost))+'</span></label>'+num('pl-'+k,p.cost)+'</div>').join('')+
      '<div class="note">'+ic('help',14)+'<span>מחיר חדש חל על לקוחות חדשים. ללקוח קיים המחיר נשאר לפי ההסכם.</span></div></div></div>'+
    '<div class="card"><div class="card-head">'+ic('library',18)+'<h3>חבילות הרחבה</h3><span class="t-sub" style="margin-inline-start:auto;display:inline">רכישה חודשית</span></div><div class="card-pad" style="display:flex;flex-direction:column;gap:12px">'+
      PACKS.map(p=>'<div class="field" style="display:grid;grid-template-columns:1fr 1fr 140px;gap:10px;align-items:center"><input type="text" id="pk-n-'+p.k+'" value="'+esc(p.n)+'"><input type="text" id="pk-q-'+p.k+'" value="'+esc(p.q||'')+'" placeholder="כמויות (לדוגמה: 100 גרפיקות)">'+num('pk-p-'+p.k,p.price==null?'':p.price)+'</div>').join('')+
      '<div class="note">'+ic('help',14)+'<span>המחירים ייקבעו אחרי בדיקת עלויות היצירה. עד אז החבילות מוצגות עם „מחיר ייקבע”.</span></div></div></div>'+
    '</div><div style="margin-top:16px"><button class="btn btn-primary" data-act="moneySave">'+ic('save',15)+' שמירת שינויים</button></div>';
  return head+tabs+panel;
};
ACT.moneySave=()=>{const v=id=>{const e=$('#'+id);return e?e.value.trim():null;};const n=(x,d)=>{const r=parseFloat(String(x).replace(/[^\d.]/g,''));return isNaN(r)?d:r;};
  VENDORS.forEach(x=>{x.usd=n(v('vd-'+x.k),x.usd);});FX.usd=n(v('fx-usd'),FX.usd)||FX.usd;
  Object.keys(RATES).forEach(k=>{RATES[k]=n(v('rt-'+k),RATES[k]);});
  Object.keys(PLANS).forEach(k=>{PLANS[k].cost=n(v('pl-'+k),PLANS[k].cost);});
  PACKS.forEach(p=>{p.n=v('pk-n-'+p.k)||p.n;p.q=v('pk-q-'+p.k)||'';const pr=v('pk-p-'+p.k);p.price=pr===''?null:n(pr,null);});
  toast('נשמר','ספקים, תעריפים ומחירים עודכנו.');render();};
