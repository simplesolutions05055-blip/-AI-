<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeOS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:ital,wght@0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  /* ink */
  --ink:#0B1437; --ink-2:#3B4468; --ink-3:#6A7396; --ink-4:#9AA2BF;
  /* canvas + glass */
  --bg:#F3F5FC; --surface:#FFFFFF; --surface-2:#F6F8FD; --glass:rgba(255,255,255,.74); --glass-2:rgba(255,255,255,.56);
  --line:#E2E6F3; --line-2:#EDF0F8; --glass-line:rgba(255,255,255,.9);
  /* brand spectrum (sampled from the PrimeOS logo) */
  --p-navy:#092465; --p-blue:#0124C7; --p-cyan:#01B6FD; --p-lime:#6AFC01; --p-magenta:#FE07C7; --p-red:#FF0012; --p-purple:#7501F6;
  --grad:linear-gradient(120deg,#0124C7 0%,#4A1BE8 55%,#7501F6 100%);
  --grad-spectrum:linear-gradient(90deg,#FF0012,#FE07C7 25%,#7501F6 50%,#01B6FD 75%,#6AFC01);
  --brand:#0124C7; --brand-700:#011A96; --brand-100:#EAEEFF; --brand-300:#A9B8FF;
  /* status system = logo spectrum */
  --draft:#3E4A78;   --draft-100:#EEF0F8;
  --pending:#02679E; --pending-100:#E2F5FF;  /* cyan */
  --fix:#B3068C;     --fix-100:#FFE7F7;      /* magenta */
  --bad:#D1000F;     --bad-100:#FFE8EA;      /* red */
  --ok:#0B7A40;      --ok-100:#E3F8EC;      /* approved */
  --info:#6200D6;    --info-100:#F1E8FF;     /* scheduled = purple */
  --pub:#327600;     --pub-100:#EEFFDD;      /* published = lime */
  --warn:#02679E;    --warn-100:#E2F5FF;
  --mute:#5A6386;    --mute-100:#EEF0F7;
  --seal:#7501F6;    --seal-100:#F4ECFF;
  /* geometry */
  --r-s:8px; --r:12px; --r-l:18px; --r-xl:24px;
  --sh:0 1px 2px rgba(9,36,101,.05), 0 4px 14px -6px rgba(9,36,101,.10);
  --sh-2:0 2px 4px rgba(9,36,101,.05), 0 14px 32px -12px rgba(9,36,101,.22);
  --sh-3:0 30px 70px -20px rgba(9,36,101,.35), 0 8px 20px -8px rgba(9,36,101,.15);
  --glow:0 8px 24px -8px rgba(1,36,199,.55);
  --gap:16px; --topbar-h:64px; --side-w:264px;
  --f:"Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --fd:"Rubik","Heebo","Arial Hebrew",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none;font-weight:500}
h1,h2,h3,h4{font-family:var(--fd)}
:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px;border-radius:6px}
::selection{background:#D8DFFF}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}

/* ---------- Ambient background ---------- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(1200px 600px at 100% -10%,#E9EDFF 0%,transparent 60%),
  radial-gradient(900px 500px at -10% 110%,#F3EAFF 0%,transparent 60%),var(--bg)}
.ambient .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.34;will-change:transform}
.ambient .o1{width:520px;height:520px;background:#01B6FD;top:-160px;right:12%;animation:drift1 26s ease-in-out infinite}
.ambient .o2{width:460px;height:460px;background:#7501F6;bottom:-180px;left:8%;opacity:.22;animation:drift2 32s ease-in-out infinite}
.ambient .o3{width:360px;height:360px;background:#FE07C7;top:38%;left:38%;opacity:.12;animation:drift3 38s ease-in-out infinite}
.ambient .o4{width:300px;height:300px;background:#6AFC01;bottom:6%;right:26%;opacity:.14;animation:drift1 44s ease-in-out infinite reverse}
.ambient .grid-fx{position:absolute;inset:0;background-image:radial-gradient(rgba(9,36,101,.09) 1px,transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 75%)}
.ambient .streak{position:absolute;height:1px;width:220px;background:linear-gradient(90deg,transparent,rgba(1,36,199,.55),transparent);opacity:0;animation:streak 9s linear infinite}
.ambient .s1{top:18%;animation-delay:1s}.ambient .s2{top:46%;animation-delay:4.5s}.ambient .s3{top:72%;animation-delay:7s}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,60px) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,-50px) scale(1.08)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}33%{transform:translate(-60px,-40px)}66%{transform:translate(50px,30px)}}
@keyframes streak{0%{transform:translateX(110vw);opacity:0}8%{opacity:.8}30%{transform:translateX(-30vw);opacity:0}100%{opacity:0;transform:translateX(-30vw)}}

/* ---------- Glass primitive ---------- */
.glass,.card,.stat,.cc,.tbl-wrap,.cal,.filters,.stepper,.chan-card,.empty,.tile,.sidebar,.topbar,.hero{
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--glass-line);box-shadow:var(--sh)}

/* ---------- Login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;position:relative;z-index:1}
.auth-brand{position:relative;overflow:hidden;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);
  background:radial-gradient(700px 500px at 80% 20%,rgba(1,182,253,.20),transparent 60%),radial-gradient(600px 500px at 10% 90%,rgba(117,1,246,.18),transparent 60%),radial-gradient(400px 300px at 60% 70%,rgba(254,7,199,.10),transparent 60%),#FBFCFF}
.auth-brand:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(9,36,101,.10) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
.auth-brand:after{content:"";position:absolute;width:640px;height:640px;left:-220px;bottom:-260px;border-radius:50%;border:1px solid rgba(1,36,199,.10);box-shadow:0 0 0 80px rgba(1,36,199,.025),0 0 0 160px rgba(117,1,246,.02)}
.auth-brand > *{position:relative;z-index:1}
.auth-hero-mark{width:132px;height:auto;filter:drop-shadow(0 18px 30px rgba(1,36,199,.25));animation:float 7s ease-in-out infinite;margin-bottom:28px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.auth-brand h1{font-size:46px;line-height:1.12;font-weight:700;margin:0 0 16px;max-width:17ch;letter-spacing:-.5px}
.auth-brand h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand p{color:var(--ink-2);margin:0;max-width:46ch;font-size:16px}
.auth-points{display:flex;flex-direction:column;gap:10px;margin-top:32px}
.auth-points span{display:flex;gap:12px;align-items:center;color:var(--ink);font-size:14.5px;font-weight:500}
.auth-points span svg{width:34px;height:34px;padding:8px;border-radius:10px;background:#fff;color:var(--p-blue);box-shadow:var(--sh)}
.auth-points span:nth-child(2) svg{color:var(--p-purple)}
.auth-points span:nth-child(3) svg{color:#0288C7}
.auth-foot{color:var(--ink-3)!important;font-size:12.5px}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 32px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-inline-start:1px solid var(--line)}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:28px;margin:0 0 6px;font-weight:700;letter-spacing:-.3px}
.auth-card .sub{color:var(--ink-3);margin:0 0 28px;font-size:14.5px}
.auth-note{margin-top:24px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-3);font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.demo-strip{background:linear-gradient(90deg,#F4ECFF,#E9F7FF);border:1px solid #E3D6FF;color:#4B1FA0;border-radius:var(--r);padding:10px 14px;font-size:12.8px;margin-bottom:24px;display:flex;gap:10px;align-items:center;font-weight:500}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-brand{padding:36px 24px}.auth-brand h1{font-size:32px}}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo-img{width:38px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(1,36,199,.25))}
.logo .txt{font-family:var(--fd);font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1;direction:ltr;font-style:italic}
.logo .txt .pr{color:var(--p-navy)}.logo .txt .os{color:var(--p-purple)}
.logo .sub{display:block;font-family:var(--f);font-style:normal;direction:rtl;font-size:11.5px;font-weight:500;color:var(--ink-3);margin-top:4px;letter-spacing:0}
.logo-mark{display:none}

/* ---------- App shell ---------- */
.app{display:none;min-height:100vh;position:relative;z-index:1}
.app.on{display:block}
.topbar{position:fixed;top:14px;right:calc(var(--side-w) + 28px);left:14px;height:var(--topbar-h);border-radius:var(--r-l);display:flex;align-items:center;gap:14px;padding:0 12px 0 12px;z-index:60}
.topbar .side-toggle{display:none}
.topbar .logo.top-logo{display:none}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:42px;border:1px solid transparent;background:rgba(9,36,101,.045);border-radius:12px;padding:0 42px 0 14px;transition:.2s var(--ease)}
.search input::placeholder{color:var(--ink-4)}
.search input:focus{background:#fff;border-color:var(--brand-300);box-shadow:0 0 0 4px rgba(1,36,199,.08)}
.search .ic{position:absolute;right:14px;top:12px;color:var(--ink-3);pointer-events:none}
.search kbd{position:absolute;left:10px;top:10px;font-family:var(--f);font-size:11px;color:var(--ink-3);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;position:relative;transition:.18s var(--ease)}
.icon-btn:hover{background:#fff;border-color:var(--line);color:var(--brand);box-shadow:var(--sh)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--p-magenta);border:2px solid #fff;box-shadow:0 0 0 3px rgba(254,7,199,.18)}
.org-switch{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.7);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.18s}
.org-switch:hover{background:#fff;box-shadow:var(--sh)}
.org-switch .oi{color:var(--p-blue)}
.avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#E3E8FF,#F1E6FF);color:var(--p-navy);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.user-btn{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:4px 6px 4px 10px;border-radius:12px;transition:.18s}
.user-btn:hover{background:#fff;box-shadow:var(--sh)}
.user-btn .avatar{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.user-btn .utx{text-align:start}
.user-btn .nm{font-size:13.5px;font-weight:700;line-height:1.15;display:block}
.user-btn .rl{font-size:11.5px;color:var(--ink-3);line-height:1.2;display:block}

.sidebar{position:fixed;top:14px;right:14px;bottom:14px;width:var(--side-w);border-radius:var(--r-xl);display:flex;flex-direction:column;z-index:61;overflow:hidden}
.side-brand{padding:20px 20px 16px;display:flex;align-items:center}
.side-scroll{flex:1;overflow-y:auto;padding:0 12px}
.nav{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--ink-3);padding:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;color:var(--ink-2);cursor:pointer;border:none;background:none;width:100%;text-align:start;font-size:14.2px;font-weight:500;position:relative;transition:background .18s var(--ease),color .18s}
.nav-item svg{color:var(--ink-3);transition:color .18s}
.nav-item:hover{background:rgba(1,36,199,.05);color:var(--ink)}
.nav-item:hover svg{color:var(--brand)}
.nav-item.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(9,36,101,.06),0 8px 20px -10px rgba(1,36,199,.35)}
.nav-item.active svg{color:var(--brand)}
.nav-item.active:before{content:"";position:absolute;right:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;border-radius:4px 0 0 4px;background:var(--grad)}
.nav-item .cnt{margin-inline-start:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:linear-gradient(135deg,#FE07C7,#7501F6);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(254,7,199,.6)}
.nav-sep{height:1px;background:var(--line);margin:8px 12px}
.side-foot{padding:10px 12px 14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-2)}
.sys-status{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:12.5px;color:var(--ink-3)}
.sys-status i{width:8px;height:8px;border-radius:50%;background:#1FC764;flex:none;box-shadow:0 0 0 4px rgba(31,199,100,.15);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(31,199,100,0)}}

.main{position:relative;margin-inline-start:calc(var(--side-w) + 28px);padding:calc(var(--topbar-h) + 38px) 22px 72px 14px;max-width:1560px;min-height:100vh}
.main > *{animation:rise .45s var(--ease) both}
.main > *:nth-child(2){animation-delay:.04s}.main > *:nth-child(3){animation-delay:.08s}.main > *:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.crumb{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.8px;margin-bottom:10px}
.crumb button{background:none;border:none;color:var(--ink-3);cursor:pointer;padding:0;font-size:12.8px}
.crumb button:hover{color:var(--brand)}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.5px;line-height:1.15}
.page-head p{margin:0;color:var(--ink-3);font-size:14.5px;max-width:70ch}
.page-actions{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}

/* dashboard hero */
.hero{position:relative;border-radius:var(--r-xl);padding:28px 30px;margin-bottom:var(--gap);overflow:hidden;background:rgba(255,255,255,.8)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(500px 220px at 0% 0%,rgba(1,182,253,.16),transparent 70%),radial-gradient(420px 240px at 30% 120%,rgba(117,1,246,.14),transparent 70%),radial-gradient(260px 160px at 12% 60%,rgba(106,252,1,.10),transparent 70%);pointer-events:none}
.hero:after{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--grad-spectrum);opacity:.9}
.hero .page-head{margin:0;position:relative}
.hero .page-head h1{font-size:34px}
.hero-mark{position:absolute;left:-30px;top:50%;width:230px;transform:translateY(-50%) rotate(-8deg);opacity:.07;pointer-events:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;background:#fff;color:var(--ink);transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s,border-color .2s;white-space:nowrap;box-shadow:0 1px 2px rgba(9,36,101,.05)}
.btn:hover{border-color:var(--brand-300);color:var(--brand);box-shadow:var(--sh-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn[disabled],.btn.is-disabled{opacity:.45;cursor:not-allowed;pointer-events:none;box-shadow:none}
.btn-primary{background:var(--grad);background-size:160% 100%;background-position:0 0;color:#fff;border-color:transparent;box-shadow:var(--glow)}
.btn-primary:hover{color:#fff;border-color:transparent;background-position:100% 0;box-shadow:0 12px 28px -8px rgba(74,27,232,.6)}
.btn-ok{background:linear-gradient(120deg,#0E9A52,#27B864);border-color:transparent;color:#fff;box-shadow:0 8px 22px -10px rgba(14,138,74,.7)}
.btn-ok:hover{color:#fff;border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2);box-shadow:none}
.btn-ghost:hover{background:rgba(1,36,199,.06);box-shadow:none;border-color:transparent}
.btn-quiet-bad{background:#fff;border-color:var(--line);color:var(--bad)}
.btn-quiet-bad:hover{background:var(--bad-100);border-color:#FFC7CC;color:var(--bad)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-lg{height:48px;padding:0 22px;font-size:15px;border-radius:14px}
.btn-block{width:100%}

/* ---------- Cards / grids ---------- */
.card{border-radius:var(--r-l)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-head > svg{width:34px;height:34px;padding:8px;border-radius:10px;background:var(--brand-100);color:var(--brand)}
.card-head h3{margin:0;font-size:16.5px;font-weight:600}
.card-head .more{margin-inline-start:auto}
.grid{display:grid;gap:var(--gap)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.split{display:grid;grid-template-columns:1fr 340px;gap:var(--gap);align-items:start}
.split-wide{display:grid;grid-template-columns:1fr 380px;gap:var(--gap);align-items:start}

.stat{--c:var(--brand);--c1:var(--brand-100);position:relative;overflow:hidden;border-radius:var(--r-l);padding:20px 22px;cursor:pointer;text-align:start;transition:transform .2s var(--ease),box-shadow .2s var(--ease);display:flex;flex-direction:column}
.stat:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;left:-40px;top:-50px;background:var(--c);opacity:.07;transition:.3s var(--ease)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.stat:hover:after{opacity:.13;transform:scale(1.15)}
.stat[data-filter=draft]{--c:var(--p-blue);--c1:#E8ECFF}
.stat[data-filter=pending]{--c:#0296D8;--c1:#E2F5FF}
.stat[data-filter=scheduled]{--c:var(--p-purple);--c1:#F1E8FF}
.stat[data-filter=published]{--c:#46B000;--c1:#EEFFDD}
.stat .lbl{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:10px;font-weight:500}
.stat .lbl svg{width:36px;height:36px;padding:9px;border-radius:11px;background:var(--c1);color:var(--c)}
.stat .num{font-family:var(--fd);font-size:40px;font-weight:700;letter-spacing:-1px;margin-top:14px;line-height:1;color:var(--ink)}
.stat .foot{font-size:12.8px;color:var(--ink-3);margin-top:10px;display:flex;align-items:center;gap:6px}
.stat .foot:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}

/* ---------- Status badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge svg{width:13px;height:13px}
.s-draft{background:var(--draft-100);color:var(--draft);border-color:#DFE3F1}
.s-pending{background:var(--pending-100);color:var(--pending);border-color:#BDE7FC}
.s-fix{background:var(--fix-100);color:var(--fix);border-color:#FFC4EC}
.s-rejected{background:var(--bad-100);color:var(--bad);border-color:#FFCACF}
.s-approved{background:var(--ok-100);color:var(--ok);border-color:#BDEBD0}
.s-scheduled{background:var(--info-100);color:var(--info);border-color:#DCC8FF}
.s-published{background:var(--pub-100);color:var(--pub);border-color:#CBF2A6}
.s-failed{background:#FFE1E4;color:#B0000D;border-color:#FFB9C0}
.s-archived{background:var(--mute-100);color:var(--mute);border-color:#E0E3EE}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:12.3px;color:var(--ink-2);font-weight:500}

/* ---------- Forms ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap);padding:12px 14px;border-radius:var(--r-l)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3);font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{
  height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;width:100%;transition:border-color .18s,box-shadow .18s;box-shadow:inset 0 1px 2px rgba(9,36,101,.03)}
.filters input[type=text],.filters select{height:40px;background:var(--surface-2)}
textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.65}
input::placeholder,textarea::placeholder{color:var(--ink-4)}
input:hover,select:hover,textarea:hover{border-color:#CDD4EA}
input:focus,select:focus,textarea:focus{border-color:var(--p-blue);box-shadow:0 0 0 4px rgba(1,36,199,.10);outline:none;background:#fff}
input[disabled],select[disabled],textarea[disabled]{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%236A7396' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:left 12px center;padding-inline-end:14px;padding-inline-start:34px}
.seg{display:inline-flex;background:rgba(9,36,101,.05);border-radius:12px;padding:4px;gap:2px}
.seg button{border:none;background:none;height:32px;padding:0 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;transition:.18s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(9,36,101,.08),0 4px 10px -4px rgba(9,36,101,.18)}

/* ---------- Tabs ---------- */
.tabs{display:inline-flex;gap:4px;margin-bottom:20px;overflow-x:auto;max-width:100%;background:rgba(255,255,255,.6);border:1px solid var(--glass-line);border-radius:14px;padding:5px;box-shadow:var(--sh)}
.tabs button{border:none;background:none;height:36px;padding:0 16px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-3);border-radius:10px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:.18s}
.tabs button:hover{color:var(--ink);background:rgba(1,36,199,.04)}
.tabs button.on{color:#fff;background:var(--grad);box-shadow:var(--glow)}
.tabs .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(9,36,101,.07);font-size:11.5px;display:grid;place-items:center;color:inherit}
.tabs button.on .cnt{background:rgba(255,255,255,.25)}

/* ---------- Tables ---------- */
.tbl-wrap{border-radius:var(--r-l);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12px;font-weight:700;color:var(--ink-3);padding:13px 18px;background:rgba(246,248,253,.8);border-bottom:1px solid var(--line);letter-spacing:.2px}
td{padding:14px 18px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(1,36,199,.03)}
.row-title{font-weight:600;cursor:pointer}
.row-title:hover{color:var(--brand)}
.t-sub{font-size:12.5px;color:var(--ink-3)}

/* ---------- Content cards ---------- */
.cc{border-radius:var(--r-l);overflow:hidden;display:flex;flex-direction:column;transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.cc:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.thumb{height:148px;background:linear-gradient(135deg,#0124C7 0%,#3A2BE0 55%,#01B6FD 130%);display:grid;place-items:center;color:#fff;position:relative;padding:16px;text-align:center;overflow:hidden;margin:8px 8px 0;border-radius:14px}
.thumb:before{content:"";position:absolute;inset:0;background:radial-gradient(160px 90px at 85% 15%,rgba(255,255,255,.28),transparent 70%),radial-gradient(200px 120px at 10% 110%,rgba(0,0,0,.18),transparent 70%)}
.thumb:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;left:-30px;bottom:-50px;border:18px solid rgba(255,255,255,.10)}
.thumb.t2{background:linear-gradient(135deg,#0277B3 0%,#01B6FD 60%,#6AFC01 150%)}
.thumb.t3{background:linear-gradient(135deg,#7501F6 0%,#B00AD8 55%,#FE07C7 130%)}
.thumb.t4{background:linear-gradient(135deg,#FE07C7 0%,#FF3A55 60%,#FF7A00 140%)}
.thumb.t5{background:linear-gradient(135deg,#092465 0%,#0124C7 55%,#7501F6 130%)}
.thumb .tt{font-family:var(--fd);font-weight:700;font-size:17px;line-height:1.3;max-width:20ch;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.thumb .kind{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;z-index:1;display:inline-flex;gap:5px;align-items:center}
.cc-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cc-title{font-weight:700;font-size:15px;cursor:pointer;line-height:1.35}
.cc-title:hover{color:var(--brand)}
.cc-meta{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 12px}
.cc-foot{padding:12px 16px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.ch-dots{display:flex;gap:5px;margin-inline-start:auto}
.ch-dot{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--ink-2);box-shadow:0 1px 2px rgba(9,36,101,.06)}

/* ---------- Lists / rows ---------- */
.row-list{display:flex;flex-direction:column;padding:6px}
.rowi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;transition:background .18s}
.rowi + .rowi{border-top:1px solid var(--line-2)}
.rowi:hover{background:rgba(1,36,199,.035)}
.rowi .ic-box{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-100);color:var(--brand)}
.rowi .ic-box.warn{background:var(--pending-100);color:var(--pending)}
.rowi .ic-box.fix{background:var(--fix-100);color:var(--fix)}
.rowi .ic-box.info{background:var(--info-100);color:var(--info)}
.rowi .ic-box.ok{background:var(--ok-100);color:var(--ok)}
.rowi .ic-box.bad{background:var(--bad-100);color:var(--bad)}
.rowi .grow{flex:1;min-width:0}
.rowi .nm{font-weight:600;font-size:14.2px}
.rowi .mt{font-size:12.5px;color:var(--ink-3)}

/* ---------- Timeline ---------- */
.tl{display:flex;flex-direction:column;padding:10px 20px 18px}
.tl-i{display:flex;gap:14px;position:relative;padding:10px 0}
.tl-i:not(:last-child):after{content:"";position:absolute;right:13px;top:38px;bottom:-6px;width:2px;border-radius:2px;background:linear-gradient(var(--line),transparent)}
.tl-dot{width:28px;height:28px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;z-index:1;color:var(--ink-3)}
.tl-dot.ok{background:var(--ok-100);border-color:#BDEBD0;color:var(--ok)}
.tl-dot.info{background:var(--info-100);border-color:#DCC8FF;color:var(--info)}
.tl-dot.warn{background:var(--pending-100);border-color:#BDE7FC;color:var(--pending)}
.tl-tx{font-size:13.6px;line-height:1.5}
.tl-tx b{font-weight:700}
.tl-time{font-size:12px;color:var(--ink-3)}

/* ---------- Calendar ---------- */
.cal{border-radius:var(--r-l);overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-head div{padding:12px 10px;font-size:12.5px;font-weight:700;color:var(--ink-3);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:120px;border-inline-start:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:8px;display:flex;flex-direction:column;gap:5px;transition:background .15s}
.cal-cell:hover{background:rgba(1,36,199,.025)}
.cal-cell:nth-child(7n){border-inline-start:none}
.cal-cell.off{background:rgba(9,36,101,.025)}
.cal-cell.off .dn{color:var(--ink-4)}
.cal-cell .dn{font-size:12.5px;color:var(--ink-2);font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:9px}
.cal-cell.today .dn{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.cal-ev{border-radius:8px;padding:5px 8px;font-size:11.8px;font-weight:600;cursor:pointer;border:none;border-inline-start:3px solid;line-height:1.3;text-align:start;width:100%;transition:transform .15s var(--ease),box-shadow .15s}
.cal-ev:hover{transform:translateX(-2px);box-shadow:var(--sh)}
.ev-draft{background:var(--draft-100);color:var(--draft);border-color:#8B93B8}
.ev-pending{background:var(--pending-100);color:var(--pending);border-color:#01B6FD}
.ev-approved{background:var(--ok-100);color:var(--ok);border-color:#27B864}
.ev-scheduled{background:var(--info-100);color:var(--info);border-color:#7501F6}
.ev-published{background:var(--pub-100);color:var(--pub);border-color:#6AFC01}
.week-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:16px 20px 20px}
.wm-day{border:1px solid var(--line-2);border-radius:14px;padding:10px 7px;min-height:104px;display:flex;flex-direction:column;gap:5px;background:rgba(255,255,255,.7);transition:.18s}
.wm-day:hover{border-color:var(--brand-300);box-shadow:var(--sh)}
.wm-day .h{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center;line-height:1.35}
.wm-day .h span{font-family:var(--fd);font-size:17px!important;font-weight:700;color:var(--ink)!important}
.wm-pill{font-size:10.8px;font-weight:600;border-radius:7px;padding:4px 6px;line-height:1.3;cursor:pointer;text-align:start;border:none;border-inline-start:2.5px solid;width:100%}

/* ---------- Wizard / stepper ---------- */
.stepper{display:flex;align-items:center;border-radius:var(--r-l);padding:14px 20px;margin-bottom:var(--gap);overflow-x:auto}
.step{display:flex;align-items:center;gap:10px;flex:none;padding-inline-end:14px}
.step .n{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:13.5px;font-weight:700;background:#fff;color:var(--ink-3);border:1px solid var(--line);flex:none;font-family:var(--fd);transition:.25s var(--ease)}
.step.on .n{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow);transform:scale(1.06)}
.step.done .n{background:var(--ok-100);color:var(--ok);border-color:#BDEBD0}
.step .t{font-size:13.8px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.step.on .t{color:var(--ink)}
.step.done .t{color:var(--ink-2)}
.step-line{width:40px;height:2px;border-radius:2px;background:var(--line);flex:none;margin-inline-end:14px}
.step.done + .step-line{background:linear-gradient(270deg,#27B864,#01B6FD)}
.wiz-foot{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:20px;border-top:1px solid var(--line-2)}
.wiz-foot .end{margin-inline-start:auto;display:flex;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-grid .full{grid-column:1/-1}

/* selectable tiles */
.tiles{display:grid;gap:12px}
.tile{border-radius:var(--r-l);padding:18px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:8px;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s;position:relative}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--brand-300)}
.tile.on{border-color:var(--p-blue);background:linear-gradient(160deg,rgba(234,238,255,.95),rgba(244,236,255,.9));box-shadow:0 0 0 3px rgba(1,36,199,.10),var(--sh)}
.tile .ti{width:46px;height:46px;border-radius:14px;background:var(--brand-100);color:var(--brand);display:grid;place-items:center;transition:.2s}
.grid > .tile:nth-child(4n+1) .ti{background:linear-gradient(135deg,#0124C7,#3A2BE0);color:#fff;box-shadow:0 8px 18px -8px rgba(1,36,199,.7)}
.grid > .tile:nth-child(4n+2) .ti{background:linear-gradient(135deg,#0277B3,#01B6FD);color:#fff;box-shadow:0 8px 18px -8px rgba(1,182,253,.7)}
.grid > .tile:nth-child(4n+3) .ti{background:linear-gradient(135deg,#7501F6,#B00AD8);color:#fff;box-shadow:0 8px 18px -8px rgba(117,1,246,.7)}
.grid > .tile:nth-child(4n+4) .ti{background:linear-gradient(135deg,#FE07C7,#FF3A55);color:#fff;box-shadow:0 8px 18px -8px rgba(254,7,199,.7)}
.tile.on .ti{background:var(--grad);color:#fff}
.tile .tn{font-weight:700;font-size:15.5px;font-family:var(--fd)}
.tile .td{font-size:13px;color:var(--ink-3);line-height:1.55}
.tile .ex{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:9px;margin-top:2px}

/* ---------- Preview surfaces ---------- */
.preview-pane{background:radial-gradient(400px 260px at 50% 30%,rgba(1,182,253,.10),transparent 70%),linear-gradient(160deg,#EEF1FB,#F4EEFC);border:1px solid var(--glass-line);border-radius:var(--r-l);padding:28px;display:grid;place-items:center;min-height:360px}
.post{width:320px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh-3)}
.post .ph{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line-2)}
.post .pimg{aspect-ratio:1;background:linear-gradient(150deg,#0E3B6B,#1E6BA8);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;gap:8px}
.post .pimg h4{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.post .pimg p{margin:0;font-size:13.5px;color:#CFE0F0}
.post .pbody{padding:12px 13px;font-size:13px;color:var(--ink-2);line-height:1.6}
.ratio-story .pimg{aspect-ratio:9/16}
.ratio-doc .pimg{aspect-ratio:3/4;background:#fff;color:var(--ink);border-bottom:1px solid var(--line-2)}
.ratio-doc .pimg h4{color:var(--ink)}
.ratio-doc .pimg p{color:var(--ink-3)}

/* ---------- Drawer / modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,20,55,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;bottom:12px;left:12px;width:460px;max-width:calc(100vw - 24px);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-line);border-radius:var(--r-xl);z-index:95;box-shadow:var(--sh-3);transform:translateX(calc(-100% - 24px));transition:transform .35s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line-2)}
.drawer-head h3{margin:0;font-size:18px;font-weight:600}
.drawer-head p{margin:3px 0 0;font-size:12.8px;color:var(--ink-3)}
.drawer-body{padding:22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--line-2);display:flex;gap:10px;background:rgba(246,248,253,.7)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:100;padding:20px;pointer-events:none}
.modal.on{pointer-events:auto}
.modal-box{background:#fff;border-radius:var(--r-xl);width:100%;max-width:480px;box-shadow:var(--sh-3);transform:translateY(12px) scale(.97);opacity:0;transition:.28s var(--ease);overflow:hidden;position:relative}
.modal-box:before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--grad-spectrum)}
.modal.on .modal-box{transform:none;opacity:1}
.modal-box .mb{padding:26px 26px 20px}
.modal-box h3{margin:0 0 8px;font-size:20px;font-weight:600}
.modal-box p{margin:0;color:var(--ink-2);font-size:14.2px;line-height:1.65}
.modal-foot{padding:16px 26px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-start;background:var(--surface-2)}
.m-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:14px}
.m-ic.warn{background:var(--pending-100);color:var(--pending)}
.m-ic.ok{background:var(--ok-100);color:var(--ok)}
.m-ic.bad{background:var(--bad-100);color:var(--bad)}
.toasts{position:fixed;bottom:20px;left:20px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--sh-3);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;min-width:340px;max-width:420px;animation:tin .35s var(--ease);position:relative;overflow:hidden}
.toast:before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(#27B864,#01B6FD)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.98)}}
.toast.err:before{background:linear-gradient(#FF0012,#FE07C7)}
.toast .tt{font-weight:700;font-size:14px}
.toast .ts{font-size:12.8px;color:var(--ink-3)}
.toast .tc{margin-inline-start:auto;display:flex;gap:6px;align-items:center}

/* ---------- States ---------- */
.sk{background:linear-gradient(90deg,#EAEDF7 25%,#F5F7FD 50%,#EAEDF7 75%);background-size:400% 100%;animation:skl 1.3s infinite;border-radius:8px}
@keyframes skl{from{background-position:100% 0}to{background-position:0 0}}
.empty{border-radius:var(--r-l);padding:52px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border-style:dashed;border-color:#D5DBEE}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;margin-bottom:8px;box-shadow:var(--glow)}
.empty h3{margin:0;font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--ink-3);font-size:14px;max-width:46ch}
.empty .btn{margin-top:12px}
.tip{position:relative;display:inline-flex}
.tip:hover .tip-b,.tip:focus-within .tip-b{opacity:1;transform:translate(50%,0)}
.tip-b{position:absolute;top:calc(100% + 8px);right:50%;transform:translate(50%,4px);background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s var(--ease);z-index:30;font-weight:500}

/* ---------- Misc ---------- */
.kv{display:flex;flex-direction:column;gap:14px}
.kv .r{display:flex;gap:10px;align-items:flex-start;font-size:13.8px}
.kv .k{color:var(--ink-3);width:100px;flex:none}
.kv .v{font-weight:600;flex:1}
.note{background:rgba(246,248,253,.9);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;font-size:13.2px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.note > svg{color:var(--brand)}
.note.demo{background:linear-gradient(90deg,#F4ECFF,#EEF6FF);border-color:#E3D6FF;color:#4B1FA0}
.note.demo > svg{color:var(--p-purple)}
.bar{height:8px;border-radius:999px;background:rgba(9,36,101,.07);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--grad)}
.dept-color{width:9px;height:9px;border-radius:3px;flex:none}
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:20px;background:rgba(246,248,253,.7);border:1px solid var(--line-2);border-radius:var(--r-l)}
.flow-node{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:160px;box-shadow:var(--sh);position:relative}
.flow-node:before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:3px;border-radius:3px 0 0 3px;background:var(--grad)}
.flow-node .fn{font-weight:700;font-size:13.8px}
.flow-node .fr{font-size:12px;color:var(--ink-3)}
.flow-arrow{width:34px;height:2px;background:linear-gradient(270deg,var(--brand-300),var(--line));position:relative}
.flow-arrow:after{content:"";position:absolute;right:auto;left:-2px;top:-4px;border:5px solid transparent;border-inline-start-color:var(--brand-300);border-right-color:var(--brand-300);border-left-color:transparent}
.checkline{display:flex;align-items:center;gap:10px;font-size:13.8px;padding:9px 0}
.sw{width:42px;height:24px;border-radius:999px;background:#D6DBEB;position:relative;cursor:pointer;border:none;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s var(--ease);box-shadow:0 2px 5px rgba(9,36,101,.25)}
.sw.on{background:var(--grad)}
.sw.on:after{right:21px}
.upload{border:1.5px dashed #CBD3EC;border-radius:var(--r-l);padding:26px;text-align:center;background:rgba(255,255,255,.6);cursor:pointer;transition:.2s var(--ease)}
.upload:hover{border-color:var(--p-blue);background:rgba(234,238,255,.7)}
.upload .ui{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;margin:0 auto 10px;color:#fff;box-shadow:var(--glow)}
.swatch{height:56px;border-radius:12px;border:1px solid rgba(0,0,0,.06);box-shadow:inset 0 -10px 20px rgba(0,0,0,.08)}
.chan-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-l);transition:transform .2s var(--ease),box-shadow .2s}
.chan-card:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.chan-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none;box-shadow:0 8px 16px -8px rgba(0,0,0,.45)}
.msg{max-width:78%;padding:11px 14px;border-radius:16px;font-size:13.8px;line-height:1.6}
.msg.in{background:#fff;border:1px solid var(--line-2);border-start-end-radius:4px;box-shadow:var(--sh)}
.msg.out{background:linear-gradient(135deg,#EAEEFF,#F1E8FF);border:1px solid #DCD9FF;margin-inline-start:auto;border-start-start-radius:4px}
.voice{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line-2);border-radius:16px;max-width:78%;box-shadow:var(--sh)}
.wave{display:flex;align-items:center;gap:2.5px;height:26px;flex:1}
.wave i{width:3px;background:linear-gradient(#01B6FD,#7501F6);border-radius:2px;display:block}
.mini-bar{display:flex;align-items:flex-end;gap:12px;height:170px;padding:20px 20px 0}
.mini-bar .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.mini-bar .b .col{width:100%;max-width:56px;border-radius:10px 10px 4px 4px;min-height:4px;box-shadow:inset 0 10px 16px rgba(255,255,255,.25)}
.mini-bar .b .lb{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.3}
.mini-bar .b .vl{font-family:var(--fd);font-size:14px;font-weight:700}

}

/* ================= v3: contrast + affordance + minimal text ================= */
:root{
  --bg:#E6EAF4; --surface-2:#F2F4FA;
  --line:#D5DBEA; --line-2:#E4E8F2;
  --ink-3:#586184;
  --glass:rgba(255,255,255,.95); --glass-line:#FFFFFF;
  --sh:0 1px 2px rgba(9,36,101,.08),0 6px 18px -8px rgba(9,36,101,.18);
  --sh-2:0 2px 4px rgba(9,36,101,.08),0 18px 36px -14px rgba(9,36,101,.32);
}
.ambient{background:radial-gradient(1100px 520px at 100% -10%,#DCE3FB 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#E8DDFB 0%,transparent 60%),var(--bg)}
.ambient .orb{opacity:.16}.ambient .o2{opacity:.12}.ambient .o3,.ambient .o4{opacity:.06}
.ambient .grid-fx{opacity:.6}
.glass,.card,.stat,.cc,.tbl-wrap,.cal,.filters,.stepper,.chan-card,.empty,.tile,.sidebar,.topbar,.hero{border:1px solid rgba(213,219,234,.9)}
.sidebar{background:rgba(255,255,255,.97)}
/* text diet */
.page-head p,.card-head .t-sub,.tile .ex,.note.demo,.auth-note,.sec-t .t-sub,.route-cards .card > p,.car-tt .t-sub,.dc-lead .t-sub{display:none!important}
.page-head{margin-bottom:18px;align-items:center}
.page-head h1{margin:0}
.hero .page-head h1{font-size:32px}
.hero{padding:22px 26px}
/* buttons: clearly clickable */
.btn{background:#fff;border:1.5px solid #C9D1EA;color:var(--p-navy);font-weight:700;box-shadow:0 1px 0 rgba(9,36,101,.06),0 2px 6px -2px rgba(9,36,101,.12)}
.btn:hover{background:#F2F5FF;border-color:var(--p-blue);color:var(--p-blue)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn-primary{border:none;color:#fff;box-shadow:0 10px 22px -8px rgba(1,36,199,.75),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:hover{color:#fff;background-position:100% 0;box-shadow:0 14px 28px -8px rgba(74,27,232,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-ghost{background:var(--brand-100);border:1.5px solid transparent;color:var(--p-blue);box-shadow:none}
.btn-ghost:hover{background:#DCE3FF;border-color:transparent}
.btn-ok{box-shadow:0 10px 22px -8px rgba(14,138,74,.8)}
.btn-quiet-bad{border-color:#F5B9C0;color:var(--bad);background:#FFF5F6}
.btn-sm{height:34px;font-size:13px}
.icon-btn{background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--p-blue);color:var(--p-blue);background:#F2F5FF}
.topbar .icon-btn.side-toggle{border-color:var(--line)}
.org-switch{border-width:1.5px;background:#fff;color:var(--p-navy)}
.org-switch:hover{border-color:var(--p-blue)}
/* nav: unmistakable active state */
.nav-item{font-weight:600;color:var(--ink-2)}
.nav-item.active{background:var(--grad);color:#fff;box-shadow:0 10px 22px -10px rgba(1,36,199,.8)}
.nav-item.active svg{color:#fff}
.nav-item.active:before{display:none}
.nav-item.active .cnt{background:#fff;color:var(--p-purple);box-shadow:none}
.nav-group{color:var(--ink-3);opacity:.85}
/* clickable surfaces */
.stat,.cc,.tile,.chan-card,.dept-card,.org-cell,.rowi[data-act],tbody tr{cursor:pointer}
.stat:before{content:"";position:absolute;left:16px;top:18px;width:28px;height:28px;border-radius:9px;background:var(--c1) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%230124C7' stroke-width='2.2' stroke-linecap='round'><path d='M10 4l-4 4 4 4'/></svg>") center/14px no-repeat;opacity:0;transform:translateX(6px);transition:.2s var(--ease)}
.stat:hover:before{opacity:1;transform:none}
.stat{border-bottom:3px solid var(--c)}
.tile:hover,.cc:hover,.chan-card:hover{border-color:var(--p-blue)}
tbody tr:hover{background:#EEF2FF}
tbody tr:hover .row-title,tbody tr:hover .org-cell b{color:var(--p-blue)}
/* inputs: visible fields */
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{border:1.5px solid #CBD2E6;background:#fff}
.filters input[type=text],.filters select{background:#fff}
.locked{border:1.5px dashed #BAC3DE}
/* badges a touch bolder */
.badge{font-weight:700;border-width:1.5px}
/* tabs */
.tabs{background:#fff;border:1px solid var(--line)}
.tabs button{color:var(--ink-2)}
/* demo marker, replaces the long demo notes */
.demo-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#F1E8FF;color:var(--info);font-size:11.5px;font-weight:700;white-space:nowrap}
@media(max-width:900px){.demo-chip{display:none}}
.btn.btn-primary{background:var(--grad);background-size:160% 100%;color:#fff;border:none}
.btn.btn-primary:hover{background-position:100% 0;color:#fff}
.btn.btn-ok{background:linear-gradient(120deg,#0E9A52,#27B864);color:#fff;border:none}
.btn.btn-ghost{background:var(--brand-100);color:var(--p-blue);border-color:transparent}
/* more text diet */
.grid > .tile .td,.card-pad > h3 + p,.card > h3 + p,.tile .ex,.upload .t-sub{display:none!important}
.stat .foot{font-size:12.3px}

/* ================= create flow v2 ================= */
.flow-steps{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 8px}
.flow-steps span{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-3);padding:0 6px}
.flow-steps b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1.5px solid var(--line);font-size:12px}
.flow-steps .on{color:var(--ink)}.flow-steps .on b{background:var(--grad);color:#fff;border:none}
.flow-steps .done b{background:var(--ok-100);color:var(--ok);border-color:#BDEBD0}
.flow-steps i{width:26px;height:2px;background:var(--line);border-radius:2px}
.brief-card{max-width:860px;margin:0 auto;padding:28px}
.brief-grid{display:grid;gap:20px}
.brief-card label{font-size:14px;font-weight:700;color:var(--ink)}
.brief-card input[type=text]{height:52px;font-size:17px;font-weight:600}
.brief-card textarea{font-size:15px}
.brief-tools{display:flex;gap:8px;margin-top:8px}.brief-tools .chip{cursor:pointer}
.brief-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-2)}
.plat-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plat-pick.sm{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.plat{display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2);position:relative;transition:.18s var(--ease)}
.plat .chan-logo{width:32px;height:32px;border-radius:10px;font-size:12px}
.plat:hover{border-color:var(--p-blue)}
.plat .pk{margin-inline-start:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid #C5CDE6;display:grid;place-items:center;color:transparent}
.plat.on{border-color:var(--p-blue);background:#F2F5FF;color:var(--ink);box-shadow:0 0 0 3px rgba(1,36,199,.1)}
.plat.on .pk{background:var(--grad);border:none;color:#fff}
.chan-logo.sm{width:22px;height:22px;border-radius:7px;font-size:9px;box-shadow:none}
/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start;padding-bottom:90px}
.studio-pv,.rv-pv{background:radial-gradient(500px 300px at 50% 20%,rgba(1,182,253,.12),transparent 70%),linear-gradient(160deg,#E9EDF9,#EFE8FB);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;display:flex;justify-content:center;position:sticky;top:96px}
.studio-ed,.rv-ed{display:flex;flex-direction:column;gap:12px}
.ed-sec{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.ed-sec h4{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px}.ed-sec h4 svg{color:var(--brand)}.ed-sec h4 .t-sub{margin-inline-start:auto;font-family:var(--f);font-weight:500}
.ed-sec .field{gap:0}
.sp{width:360px;max-width:100%}
.sp-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.sp-tabs button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.sp-tabs button.on{border-color:var(--p-blue);color:var(--ink);box-shadow:0 0 0 3px rgba(1,36,199,.1)}
.sp-post{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh-3)}
.sp-h{display:flex;align-items:center;gap:9px;padding:11px 13px}.sp-h b{display:block;font-size:13px}.sp-h span{font-size:11.5px;color:var(--ink-3)}
.sp-img.thumb{margin:0;border-radius:0;height:auto;display:flex;flex-direction:column;align-items:flex-start;text-align:start;padding:22px;gap:6px}
.sp-img.r-sq{aspect-ratio:1}.sp-img.r-doc{aspect-ratio:3/4}.sp-img.r-wide{aspect-ratio:16/9}.sp-img.r-story{aspect-ratio:9/14}
.sp-img.lay-bottom{justify-content:flex-end}.sp-img.lay-center{justify-content:center;align-items:center;text-align:center}.sp-img.lay-top{justify-content:flex-start;padding-top:48px}
.sp-img .tt{font-size:26px;max-width:14ch;line-height:1.15}
.sp-img.lay-center .tt{font-size:30px}
.sp-sub{position:relative;z-index:1;font-size:12.5px;opacity:.85}
.sp-ver{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.sp-play{position:absolute;inset:0;display:grid;place-items:center;z-index:1}.sp-play svg{width:58px;height:58px;padding:16px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.sp-img.busy .tt,.sp-img.busy .sp-sub{filter:blur(6px);opacity:.5}
.sp-busy{position:absolute;inset:0;z-index:3;display:grid;place-items:center;align-content:center;gap:10px;font-weight:700;background:rgba(11,20,55,.25)}
.sp-busy i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-body{padding:12px 14px 16px;font-size:13.5px;line-height:1.65;color:var(--ink);white-space:pre-wrap}
.sp-tags{color:var(--p-blue);font-weight:600;margin-top:6px;font-size:13px;word-spacing:4px}
.ai-box{display:flex;align-items:center;gap:8px;border:1.5px solid #CBD2E6;border-radius:14px;padding:5px 5px 5px 5px;background:#fff}
.ai-box:focus-within{border-color:var(--p-purple);box-shadow:0 0 0 4px rgba(117,1,246,.1)}
.ai-box input{border:none!important;box-shadow:none!important;height:36px!important;padding:0 4px!important;flex:1}
.ai-ic{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7501F6,#FE07C7);color:#fff;display:grid;place-items:center;flex:none}
.ai-quick{display:flex;gap:6px;flex-wrap:wrap}.ai-quick .chip{cursor:pointer;border-width:1.5px}.ai-quick .chip:hover{border-color:var(--p-purple);color:var(--p-purple)}
.tag-ed{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagc{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;border:1.5px dashed #BAC3DE;background:#fff;color:var(--ink-3);font-weight:700;font-size:12.8px;cursor:pointer;direction:rtl}
.tagc small{font-weight:500;color:inherit;opacity:.75}
.tagc:hover{border-color:var(--p-blue);color:var(--p-blue)}
.tagc.on{border-style:solid;border-color:var(--p-blue);background:#EAEEFF;color:var(--p-blue)}
.tag-add{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:2px 3px 2px 10px;background:#fff}
.tag-add input{border:none!important;height:26px!important;width:110px;padding:0!important;box-shadow:none!important;font-size:13px}
.tag-add .icon-btn{width:26px;height:26px;border-radius:50%}
.action-bar{position:fixed;bottom:14px;left:14px;right:calc(var(--side-w) + 28px);z-index:55;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-l);background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 -4px 30px -10px rgba(9,36,101,.3);backdrop-filter:blur(14px)}
.ab-sp{flex:1}.ab-info{font-size:13.5px;color:var(--ink-2)}
/* create center v2 */
.type-grid .type-tile{flex-direction:row;align-items:center;gap:14px;padding:20px}
.type-tile .ti{width:54px;height:54px;border-radius:16px}
.type-tile .tn{font-size:17px}
.type-tile .go{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);transition:.2s}
.type-tile:hover .go{background:var(--grad);color:#fff}
.bulk-cta{width:100%;margin-top:18px;display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:var(--r-xl);border:none;cursor:pointer;text-align:start;color:#fff;background:linear-gradient(120deg,#092465 0%,#2A1BB0 45%,#7501F6 100%);box-shadow:0 20px 40px -18px rgba(74,27,232,.7);position:relative;overflow:hidden;transition:transform .2s var(--ease)}
.bulk-cta:before{content:"";position:absolute;inset:0;background:radial-gradient(300px 160px at 10% 50%,rgba(254,7,199,.35),transparent 70%),radial-gradient(260px 160px at 90% 0%,rgba(1,182,253,.35),transparent 70%)}
.bulk-cta > *{position:relative}
.bulk-cta:hover{transform:translateY(-2px)}
.bc-ic{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.bc-tx b{display:block;font-family:var(--fd);font-size:21px}.bc-tx span{font-size:14px;opacity:.8}
.bulk-cta .btn{margin-inline-start:auto;background:#fff!important;color:var(--p-navy)!important;box-shadow:none}
.sec-h{font-size:17px;margin:26px 0 12px}
.camp-card{overflow:hidden;cursor:pointer;transition:.2s var(--ease)}.camp-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.cc-strip{display:flex;gap:4px;padding:8px 8px 0}.cc-strip .thumb{flex:1;height:62px;margin:0;border-radius:10px;padding:0}
.cc-strip .thumb:before,.cc-strip .thumb:after{display:none}
.camp-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.camp-meta.big{font-size:13.5px;gap:6px 16px}.camp-meta span{display:inline-flex;align-items:center;gap:5px}
/* bulk setup */
.bulk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.bulk-form{padding:6px 24px}
.bf-row{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--line-2)}
.bf-row:last-child{border-bottom:none}
.bf-row > label{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:12px}
.seg.big button{height:40px;padding:0 16px;font-size:14px}
.hol-pick{display:flex;flex-wrap:wrap;gap:8px}
.up-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.up-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;border:1.5px dashed #BAC3DE;background:#fff;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-2);transition:.18s}
.up-opt:hover{border-color:var(--p-blue);border-style:solid;color:var(--p-blue)}
.fi{display:inline-grid;place-items:center;min-width:44px;height:28px;padding:0 8px;border-radius:8px;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.3px}
.fi.docx{background:#2A5BD7}.fi.pdf{background:#E0243B}.fi.xlsx{background:#1E8E4E}
.file-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--p-blue);background:#F2F5FF}
.file-chip .icon-btn{margin-inline-start:auto;width:30px;height:30px}
.bulk-sum{padding:26px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;position:sticky;top:96px}
.bs-num{font-family:var(--fd);font-size:64px;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bs-l{font-weight:700;color:var(--ink-2);margin:6px 0 18px}
.bs-rows{width:100%;display:flex;flex-direction:column;margin-bottom:20px}
.bs-rows div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-2)}.bs-rows b{color:var(--ink);display:flex}.bs-rows svg{color:var(--ok)}
.gen-screen{max-width:560px;margin:60px auto;padding:44px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.gen-orb{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 0deg,#0124C7,#01B6FD,#6AFC01,#FE07C7,#FF0012,#7501F6,#0124C7);animation:spin 2.4s linear infinite;padding:5px}
.gen-orb img{width:100%;height:100%;border-radius:50%;background:#fff;padding:18px;animation:spin 2.4s linear infinite reverse}
.gen-screen h2{margin:0;font-size:24px}
.gen-bar{width:100%;height:12px;border-radius:999px;background:rgba(9,36,101,.08);overflow:hidden}.gen-bar span{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .14s linear}
.gen-steps{display:flex;gap:18px;color:var(--ink-3);font-size:13px;font-weight:600}.gen-steps span{display:flex;gap:6px;align-items:center}
/* review carousel */
.seg .sc{font-size:11px;background:rgba(9,36,101,.08);border-radius:999px;padding:0 6px;margin-inline-start:2px}
.rv{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:12px;align-items:center}
.rv-nav{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--sh);transition:.18s}
.rv-nav:hover{background:var(--grad);color:#fff;border-color:transparent;transform:scale(1.06)}
.rv-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.rv-pv{position:relative;top:auto;flex-direction:column;align-items:center}
.rv-count{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3)}.rv-count b{font-family:var(--fd);font-size:22px;color:var(--ink)}
.flag-note{align-self:stretch;margin-bottom:12px;background:var(--fix-100);color:var(--fix);border:1.5px solid #FFC4EC;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.rv-strip{display:flex;gap:10px;overflow-x:auto;padding:16px 4px 100px;scroll-snap-type:x proximity;scrollbar-width:thin}
.rs-it{flex:0 0 112px;border:none;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;scroll-snap-align:center}
.rs-it .thumb{height:112px;margin:0;border-radius:14px;padding:8px;border:3px solid transparent;transition:.18s}
.rs-it .thumb .tt{font-size:11.5px}
.rs-it .thumb:after{display:none}
.rs-it:hover .thumb{transform:translateY(-3px)}
.rs-it.on .thumb{border-color:var(--p-blue);box-shadow:0 0 0 3px rgba(1,36,199,.25)}
.rs-it.fl .thumb{border-color:var(--p-magenta)}
.rs-d{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.rs-it .dot{position:absolute;top:6px;left:6px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}.rs-it .dot.e{background:#01B6FD}.rs-it .dot.f{background:var(--p-magenta);left:22px}
.camp-appr{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.ca-card{display:flex;align-items:center;gap:18px;padding:12px 18px 12px 12px;border:1.5px solid var(--brand-300)}
.ca-card .cc-strip.big{padding:0;flex:0 0 330px}.ca-card .cc-strip .thumb{height:58px}
.ca-card .cc-strip .more{flex:0 0 46px;display:grid;place-items:center;font-weight:800;color:var(--ink-3);font-size:13px}
.ca-body{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.ca-body b{font-size:16px}.ca-body .badge{align-self:flex-start}
.dir-l{margin-inline-start:auto;font-size:12px;color:var(--ink-3);font-weight:600}
@media(max-width:1280px){.studio,.rv-main,.bulk-layout{grid-template-columns:minmax(0,1fr)}.studio-pv,.bulk-sum{position:relative;top:auto}.ca-card{flex-wrap:wrap}.ca-card .cc-strip.big{flex-basis:100%}}
@media(max-width:900px){.action-bar{right:10px;left:10px;bottom:10px;flex-wrap:wrap}.action-bar .ab-sp{display:none}.action-bar .btn-lg{flex:1}
 .rv{grid-template-columns:1fr}.rv-nav{display:none}.up-row{grid-template-columns:1fr}.page-actions .flow-steps{display:none}.bulk-cta{flex-wrap:wrap}.bulk-cta .btn{width:100%}}
.seg.big{display:flex;flex-wrap:wrap}
.bulk-form,.bf-row,.bulk-layout > *{min-width:0}
@media(max-width:560px){.seg.big button{flex:1 1 30%;padding:0 8px}.plat-pick,.plat-pick.sm{grid-template-columns:1fr 1fr}}
/* ================= admin v2 ================= */
.plan-b{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.3px;font-weight:700;white-space:nowrap;border:1.5px solid}
.plan-appr{background:#EAEEFF;color:#0124C7;border-color:#C6D0FF}
.plan-solo{background:#E2F5FF;color:#02679E;border-color:#BDE7FC}
.plan-split{padding:10px 18px 18px;display:flex;flex-direction:column;gap:4px}
.ps-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ps-row .grow{display:flex;flex-direction:column}.ps-dot{width:12px;height:12px;border-radius:4px;background:var(--pc);flex:none}
.ps-sum{font-family:var(--fd);font-size:18px}
.ps-bar{display:flex;gap:3px;height:10px;margin-top:10px}.ps-bar span{border-radius:4px}
.rev-empty{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;border:1.5px dashed #BAC3DE;background:#fff;color:var(--ink-3);font-weight:700;font-size:12px;cursor:pointer}
.rev-empty:hover{border-color:var(--p-blue);border-style:solid;color:var(--p-blue)}
.rev-empty-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 18px;text-align:center;color:var(--ink-3)}
.rev-empty-card b{color:var(--ink)}
.oh-money{display:flex;gap:10px;margin-inline-start:auto}
.oh-money div{display:flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);min-width:92px}
.oh-money span{font-size:12px;color:var(--ink-3)}.oh-money b{font-family:var(--fd);font-size:22px;line-height:1.2}
.oh-money + .oh-acts{margin-inline-start:0}
.plan-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan-pick.vk-pick{grid-template-columns:repeat(3,1fr)}.plan-pick.col{grid-template-columns:1fr}
.plan-tile{gap:6px}.plan-tile .pt-cost{margin-inline-start:auto;font-family:var(--fd);font-size:20px}.plan-tile .pt-cost small{font-size:11px;color:var(--ink-3);font-weight:500;font-family:var(--f)}
.plan-tile.on .rt-radio{border-color:var(--p-blue)}.plan-tile.on .rt-radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--grad)}
.ubar.pk span{background:linear-gradient(270deg,#E0069F,#FF3A55)}
@media(max-width:900px){.plan-pick,.plan-pick.vk-pick{grid-template-columns:1fr 1fr}.oh-money{margin-inline-start:0;width:100%}.oh-money div{flex:1}}
body.is-admin .row-acts .btn-ghost{font-size:0;gap:0;padding:0 9px}

.fx-log{display:flex;flex-direction:column;gap:8px}.fx-it{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;padding:8px 10px;background:var(--surface-2);border-radius:10px}.fx-it .t-sub{margin-inline-start:auto;font-size:11.5px}
.seg button[disabled]{opacity:.38;cursor:not-allowed}
.pg-pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pg-step{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:3px}.pg-step b{min-width:28px;text-align:center;font-size:15px}
.dk-car{display:flex;align-items:center;gap:10px}
.slide{position:relative;flex:1;aspect-ratio:16/9;background:#fff;border-radius:12px;box-shadow:0 12px 30px -14px rgba(11,20,55,.35);padding:5% 6%;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-width:0}
.slide.busy>*:not(.sp-busy){filter:blur(2px);opacity:.6}
.slide h4{margin:0;font-size:20px;color:#0E3B6B}.slide .tl{height:9px}
.sl-cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;border-radius:10px;padding:6%;background:linear-gradient(120deg,#0E3B6B,#1E6BA8);color:#fff}.sl-cover h3{margin:0;font-size:28px}.sl-cover.end{align-items:center}
.st-designed .sl-cover{background:linear-gradient(120deg,#0124C7,#7501F6)}.st-designed h4{color:#7501F6}
.st-data .sl-cover{background:#0E3B6B}
.sl-row{display:flex;gap:18px;flex:1;align-items:center}.sl-tx{flex:1;display:flex;flex-direction:column;gap:10px}
.sl-img{width:42%;align-self:stretch;border-radius:10px;background:linear-gradient(140deg,#01B6FD,#6AFC01)}
.sl-chart{width:46%;align-self:stretch;display:flex;align-items:flex-end;gap:8px;border-bottom:2px solid #CFD6E6}.sl-chart i{flex:1;background:#1E6BA8;border-radius:5px 5px 0 0}
.sl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}.sl-list li{display:flex;gap:10px;align-items:center}.sl-list li i{width:14px;height:14px;border-radius:4px;background:#1E6BA8;flex:none}.sl-list li p{flex:1}
.st-designed .sl-list li i{background:#FE07C7;border-radius:50%}
.sl-time{display:flex;justify-content:space-between;align-items:flex-start;flex:1;padding-top:30px;border-top:3px solid #CFD6E6;margin-top:30px}.sl-time span{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:-39px}.sl-time i{width:16px;height:16px;border-radius:50%;background:#1E6BA8;border:3px solid #fff}.sl-time small{font-size:12px}
.sl-n{position:absolute;bottom:8px;left:12px;font-size:11px;color:var(--ink-4)}
.slide .sp-ver{position:absolute;top:10px;left:12px}
.slide.mini{flex:none;width:100%;padding:6%;gap:4px;border-radius:6px;box-shadow:none;border:1px solid var(--line)}
.slide.mini h4{font-size:7px}.slide.mini h3{font-size:9px}.slide.mini small{display:none}.slide.mini .tl{height:3px}.slide.mini .sl-row,.slide.mini .sl-list{gap:4px}.slide.mini .sl-list li i{width:5px;height:5px}.slide.mini .sl-time{padding-top:6px;margin-top:8px;border-top-width:1px}.slide.mini .sl-time span{margin-top:-11px}.slide.mini .sl-time i{width:6px;height:6px;border-width:1px}
.dk-count{text-align:center;margin:12px 0 8px;font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;justify-content:center;align-items:center}
.dk-strip{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 10px;scroll-snap-type:x mandatory}
.dk-th{position:relative;flex:none;width:130px;padding:4px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer;scroll-snap-align:center}
.dk-th.on{border-color:var(--brand)}.dk-n{position:absolute;bottom:8px;right:9px;font-size:10.5px;font-weight:700;background:#fff;border-radius:6px;padding:0 5px}
.dk-th .dot{position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%;background:var(--p-magenta)}
.rv-nav[disabled]{opacity:.3;pointer-events:none}
.vs-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vs{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:start}
.vs:hover{border-color:var(--brand-300)}.vs.on{border-color:var(--brand);background:var(--brand-100)}
.vs b{font-size:15.5px}.vs>span:not(.vs-ic):not(.rt-radio){font-size:12.5px;color:var(--ink-3);line-height:1.45}
.vs-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#fff;margin-bottom:4px}
.raw-grid{display:flex;flex-wrap:wrap;gap:10px}
.raw{position:relative;width:86px;height:86px;margin:0;padding:0;border-radius:12px;display:grid;place-items:center}
.raw .icon-btn{position:absolute;top:4px;left:4px;width:22px;height:22px;min-width:0;background:rgba(255,255,255,.9);color:var(--ink)}
.raw.add{border:1.5px dashed var(--brand-300);background:#fff;color:var(--brand);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.raw.add small{font-size:11.5px}
.fi.mp4,.fi.mov,.fi.key,.fi.txt,.fi.png,.fi.svg,.fi.org{background:var(--brand-100);color:var(--brand)}
.vd-meta .vm-rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.vd-meta .vm-rows span{color:var(--ink-3)}
.ev-cta{margin-top:12px}.ev-cta .bc-ic{background:linear-gradient(120deg,#FE07C7,#7501F6)}
.ev-ic{background:linear-gradient(120deg,#FE07C7,#7501F6);color:#fff}
.es-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.es-h{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
.sting{position:relative;aspect-ratio:16/9;border-radius:16px;display:grid;place-items:center;overflow:hidden;color:#fff}
.st-in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.st-logo{width:74px;height:74px;border-radius:22px;background:#fff;color:#0E3B6B;display:grid;place-items:center;font-weight:800;font-size:24px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.st-in b{font-size:18px}.st-in small{opacity:.8}
.a-reveal .st-logo{animation:stReveal 1.6s ease both}.a-reveal b,.a-reveal small{animation:stFade 1.6s .5s ease both}
.a-zoom .st-logo{animation:stZoom 1.4s cubic-bezier(.2,1.4,.4,1) both}.a-zoom b,.a-zoom small{animation:stFade 1s .7s ease both}
.a-spin .st-logo{animation:stSpin 1.4s ease both}.a-spin b,.a-spin small{animation:stFade 1s .8s ease both}
@keyframes stReveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes stZoom{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes stSpin{from{opacity:0;transform:rotate(-200deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes stFade{from{opacity:0}to{opacity:1}}
.st-dur{position:absolute;bottom:10px;left:12px;font-size:11.5px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 9px}
.es-sw{display:flex;gap:10px}.sw-c{width:34px;height:34px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw-c.on{box-shadow:0 0 0 2px var(--brand)}
.ev-tl{display:flex;flex-direction:column;gap:12px;margin-bottom:90px}
.ev-post{display:grid;grid-template-columns:170px 150px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 16px}
.ev-post.ok{border-color:#BDEBD0;background:linear-gradient(90deg,#fff,#F3FCF7)}
.ev-post.ev-lock{opacity:.85;border-style:dashed}
.ep-when{display:flex;flex-direction:column;gap:3px}.ep-when b{font-size:15px}.ep-when>span{font-size:12.5px;color:var(--ink-3)}.ep-date{display:inline-flex;gap:5px;align-items:center;color:var(--brand)!important;font-weight:600}
.ev-th.thumb{margin:0;height:100px;border-radius:12px;font-size:12px;padding:10px}.ev-th.big{height:auto;aspect-ratio:4/5;font-size:16px}
.ev-th .tt{font-weight:700}.ev-th.busy{filter:blur(1px)}
.ev-th .sp-play{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.ev-sting{position:absolute;bottom:6px;left:6px;font-size:10px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 7px;display:inline-flex;gap:4px;align-items:center}
.lockth{background:var(--surface-2)!important;color:var(--ink-4)}
.ep-tx{display:flex;flex-direction:column;gap:4px;min-width:0}.ep-tx b{font-size:14px}.ep-tx span{font-size:12.8px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-act{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:150px}
.seg.sm button{height:28px;font-size:12px;padding:0 10px}
.ok-note{display:flex;align-items:center;gap:8px;margin-bottom:12px}.ok-note .demo-chip{margin-inline-start:auto;border:none;cursor:pointer}
.ev-sum{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:var(--gap);margin-bottom:90px}.ev-sum-c{padding:18px}.ev-sum-c h4{margin:0 0 12px;display:flex;gap:6px;align-items:center}
.ev-done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:48px 20px}.ev-done h3{margin:0}
@media(max-width:1100px){.fx-wrap,.es-grid,.ev-sum{grid-template-columns:1fr}.ev-post{grid-template-columns:1fr 120px}.ev-post .ep-tx,.ev-post .ep-act{grid-column:1/-1}.ep-act{flex-direction:row;flex-wrap:wrap}}
@media(max-width:760px){.sty-pick,.vs-pick{grid-template-columns:1fr}}
.brief-card>.field{margin-bottom:20px}
.brief-card>.field>label{font-weight:700}
.ev-th .sp-play{inset:8px auto auto 8px;width:auto;height:auto;background:none}.ev-th .sp-play svg{width:30px;height:30px;padding:8px}
.live-tx{margin:0;font-size:12px;line-height:1.6;color:#2B3550}.slide .live-tx{font-size:13px}.sl-list .live-tx{flex:1}
</style>

/* ================= WIZARD ================= */
const WSTEPS=['בריף','תוכן ושפה','עיצוב','ערוצים ותזמון','אישור'];
function startWiz(type,prefill){
  S.wiz={step:0,type:type||'graphic',
    brief:{goal:'',aud:'',dept:S.user.dept,title:'',free:'',...(prefill&&prefill.brief||{})},
    content:{title:'',body:'',cta:'',tone:'רשמי',gen:false,...(prefill&&prefill.content||{})},
    design:{tpl:'הודעת דוברות',ratio:'post'},
    dist:{ch:[],date:'2026-09-08',time:'18:00',mode:'schedule'},
    appr:{who:'מנהל מחלקה - דוברות - פרסום',note:'',notify:'in'},
    from:prefill&&prefill.from};
  S.dirty=true; go('wizard');
}
SCREENS.wizard={
  hidden:true,
  render(){
    if(!S.wiz)return SCREENS.create.render();
    const w=S.wiz,st=w.step;
    let body='';
    if(st===0)body=wizBrief(w);
    else if(st===1)body=wizContent(w);
    else if(st===2)body=wizDesign(w);
    else if(st===3)body=wizDist(w);
    else body=wizAppr(w);
    const nextLbl=st===4?'שליחה לאישור':'המשך';
    return pageHead({
      crumb:[{t:'יצירת תוכן',r:'create'},{t:'אשף היצירה'}],
      title:'יצירת '+TYPES[w.type].t,
      desc:'חמישה שלבים: בריף, ניסוח, עיצוב, ערוצים ואישור. אפשר לשמור טיוטה בכל שלב.',
      actions:'<button class="btn" data-act="wizExit">'+ic('x',16)+' יציאה</button>'
    })+
    '<div class="stepper">'+WSTEPS.map((s,i)=>
      '<div class="step '+(i===st?'on':i<st?'done':'')+'"><span class="n">'+(i<st?ic('check',14,2.4):(i+1))+'</span><span class="t">'+s+'</span></div>'+
      (i<WSTEPS.length-1?'<span class="step-line"></span>':'')).join('')+'</div>'+
    '<div class="card card-pad">'+body+
      '<div class="wiz-foot">'+
        (st>0?'<button class="btn" data-act="wizBack">'+ic('fwd',16)+' חזרה</button>':'')+
        '<div class="end"><button class="btn" data-act="wizSave">שמירה כטיוטה</button>'+
        '<button class="btn btn-primary" data-act="wizNext">'+esc(nextLbl)+' '+ic('back',16)+'</button></div>'+
      '</div></div>';
  }
};
function wizBrief(w){
  return '<h3 style="margin:0 0 4px;font-size:17px">בריף הפרסום</h3><p style="margin:0 0 18px;color:var(--ink-3);font-size:13.5px">ככל שהבריף מדויק יותר, הנוסח המוצע קרוב יותר לשפת הארגון.</p>'+
  (w.from?'<div class="note demo" style="margin-bottom:16px">'+ic('msg',16)+'<span>השדות מולאו מראש מתוך בקשת WhatsApp של '+esc(w.from)+'. אפשר לערוך הכול לפני המשך.</span></div>':'')+

      desc:TYPES[it.ty].t+' · '+it.d+' · עודכן '+it.u,
